// Cambia una serie a partir de un día: las citas desde ese día se sustituyen por las de la serie con los datos
// nuevos (las que se cambiaron aparte se respetan, salvo la que se está editando, que se vuelve a crear).
function cambiarSerieDesde(s, corte, datos, editando){
  const quitar = c => c.serieId === s.id && c.fechaSerie >= corte && (!c.modificada || c === editando);
  db.citas = db.citas.filter(c => !quitar(c));
  let destino = s;
  // Las citas anuladas una a una siguen anuladas.
  const excl = s.excluidas || [];
  if (corte <= s.desde){
    Object.assign(s, datos);
    if (datos.desde) s.desde = datos.desde;
  } else {
    destino = { ...s, ...datos, id: uid(), raiz: raizSerie(s), desde: corte, excluidas: excl.filter(f => f >= corte), creada: todayIso() };
    s.hasta = addDays(corte, -1);
    s.excluidas = excl.filter(f => f < corte);
    db.citas.forEach(c => { if (c.serieId === s.id && c.fechaSerie >= corte) c.serieId = destino.id; });   // las cambiadas aparte pasan a la nueva
    db.seriesCitas.push(destino);
  }
  if ('patientId' in datos) db.citas.forEach(c => { if (c.serieId === destino.id && c.fechaSerie >= corte) c.patientId = datos.patientId; });
  generarSerie(db, destino);
  return destino;
}
// Antes de quitar una cita: si tenía puntuaciones, sus ejercicios propios (los que no tocaban sin cita) se quedan
// ese día como ejercicios sin sesión, para que las puntuaciones (que pasan a «Sin cita») se sigan viendo. Las pautas
// que eran solo de esa cita se borran.
function conservarSesionCita(c){
  const pid = c.patientId, day = c.fecha;
  if (sesionesConPunt(pid, day).has(c.id)){
    const quedan = new Set(exercisesSesion(pid, day, '').map(it => it.exercise.id));
    for (const it of exercisesSesion(pid, day, c.id)){
      if (quedan.has(it.exercise.id) || !puntuadoEn(pid, day, it.exercise.id, c.id)) continue;
      const pa = it.pauta;
      db.pautas.push({ id: uid(), patientId: pid, exerciseId: pa.exerciseId, desde: day, hasta: day, asignacion: uid(), bloqueId: pa.bloqueId || '', orden: pa.orden || 0, sesion: '-' });
    }
  }
  db.pautas = db.pautas.filter(p => p.sesion !== 'c:' + c.id);
}
// Lo que se pierde (o cambia) al anular unas citas: cuántas tienen ejercicios y cuántas puntuaciones.
function textoEjerciciosCitas(citas){
  let conEj = 0, ej = 0, punt = 0;
  for (const c of citas){
    const its = exercisesSesion(c.patientId, c.fecha, c.id);
    if (!its.length) continue;
    conEj++; ej += its.length;
    punt += its.filter(it => puntuadoEn(c.patientId, c.fecha, it.exercise.id, c.id)).length;
  }
  const nObs = citas.filter(c => textoObs(c.patientId, c.fecha, c.id).trim()).length;
  const obs = nObs ? ` ${citas.length === 1 ? 'Sus observaciones pasan' : 'Las observaciones pasan'} también a «Sin sesión» de ese día.` : '';
  if (!conEj) return obs.trim();
  const cuantas = citas.length === 1 ? `Esta sesión tiene ${plural(ej, 'ejercicio', 'ejercicios')}` : `${plural(conEj, 'sesión tiene', 'sesiones tienen')} ejercicios`;
  return punt
    ? `⚠ ${cuantas} y ${plural(punt, 'ejercicio puntuado', 'ejercicios puntuados')}. Las puntuaciones no se borran: pasan a «Sin sesión» de ese día, con sus ejercicios.${obs}`
    : `${cuantas} (sin puntuar). Los que eran solo de ${citas.length === 1 ? 'esta sesión' : 'esas sesiones'} se quitan; los demás siguen en el día.${obs}`;
}
function quitarCita(c){
  conservarSesionCita(c);
  db.citas = db.citas.filter(x => x !== c);
  const s = c.serieId && getSerie(c.serieId);
  if (s && !(s.excluidas || []).includes(c.fechaSerie)) (s.excluidas = s.excluidas || []).push(c.fechaSerie);
}
// Termina una serie: anula todas sus citas desde ese día (también las cambiadas aparte). Las anteriores se quedan.
function terminarSerie(s, desde){
  const fuera = c => c.serieId === s.id && (c.fechaSerie >= desde || c.fecha >= desde);
  db.citas.filter(fuera).forEach(conservarSesionCita);
  db.citas = db.citas.filter(c => !fuera(c));
  if (desde <= s.desde){
    db.seriesCitas = db.seriesCitas.filter(x => x !== s);
    db.citas.forEach(c => { if (c.serieId === s.id){ c.serieId = ''; c.fechaSerie = ''; } });
  } else {
    s.hasta = addDays(desde, -1);
    s.excluidas = (s.excluidas || []).filter(f => f < desde);
  }
}
async function anularCita(id){
  const c = getCita(id); if (!c) return;
  const p = getP(c.patientId), s = c.serieId && getSerie(c.serieId);
  const ej = textoEjerciciosCitas([c]);
  const texto = `¿Anular la sesión de ${p ? p.nombre + ' ' + p.apellidos : 'este paciente'} del ${fmtLong(c.fecha)} a las ${c.hora}?${ej ? '\n\n' + ej : ''}`;
  let op = 'una';
  if (s){
    const desde = c.fechaSerie < c.fecha ? c.fechaSerie : c.fecha;
    const ejSig = textoEjerciciosCitas(db.citas.filter(x => x.serieId === s.id && (x.fechaSerie >= desde || x.fecha >= desde) && x !== c));

// Al dar la primera cita de un día que ya tiene ejercicios sin sesión, se pregunta qué hacer con ellos:
//   'vacia'   la cita empieza sin ejercicios; los de antes siguen sin sesión (con sus puntuaciones);
//   'copiar'  la cita tiene los mismos ejercicios, para puntuarlos aparte; los de antes siguen sin sesión;
//   'asignar' los ejercicios (y sus puntuaciones) pasan a la cita.
// «serie»: si las citas son de una serie nueva, la decisión vale para todas. Devuelve false si se cancela.
async function resolverSinSesion(citas, serie){
  const pid = citas.length ? citas[0].patientId : '';
  const con = citas.filter(c => citasDia(c.patientId, c.fecha).length === 1 && (exercisesSesion(c.patientId, c.fecha, '').length || sesionesConPunt(c.patientId, c.fecha).has('')));
  if (!con.length) return true;
  const varias = con.length > 1 || !!serie;
  const nEj = exercisesSesion(pid, con[0].fecha, '').length;
  const puntuados = con.filter(c => sesionesConPunt(pid, c.fecha).has('')).length;
  const msg = (con.length === 1
      ? `El ${fmtLong(con[0].fecha)} ya tiene ${plural(nEj, 'ejercicio', 'ejercicios')} sin sesión${puntuados ? ', con puntuaciones' : ''}.`
      : `${plural(con.length, 'día', 'días')} de la serie ya ${con.length === 1 ? 'tiene' : 'tienen'} ejercicios sin sesión${puntuados ? ` (${puntuados === 1 ? 'uno' : puntuados} con puntuaciones)` : ''}.`)
    + ' ¿Qué hacemos con ellos?'
    + `\n\n• Sesión vacía: ${varias ? 'las sesiones empiezan' : 'la sesión empieza'} sin ejercicios; los de ahora siguen sin sesión.`
    + `\n• Copiando ejercicios: ${varias ? 'cada sesión tiene' : 'la sesión tiene'} los mismos ejercicios para puntuarlos aparte; los de ahora siguen sin sesión${puntuados ? ' con sus puntuaciones' : ''}.`
    + `\n• Asignar los existentes: los ejercicios${puntuados ? ' y sus puntuaciones' : ''} pasan a ${varias ? 'las sesiones' : 'la sesión'}.`;
  const op = await elegir(msg, varias
    ? [['vacia', 'Crear sesiones vacías'], ['copiar', 'Crear sesiones copiando ejercicios'], ['asignar', 'Crear sesiones y asignar ejercicios existentes']]
    : [['vacia', 'Crear sesión vacía'], ['copiar', 'Crear sesión copiando ejercicios'], ['asignar', 'Crear sesión y asignar ejercicios existentes']],
    { titulo: 'Ejercicios sin sesión', cancelar: 'No programar la sesión', vertical: true });
  if (!op) return false;
  aplicarSinSesion(con, serie, op);
  return true;
}
function aplicarSinSesion(con, serie, op){
  const pid = con[0].patientId, fechas = con.map(c => c.fecha).sort();
  const token = serie ? 's:' + raizSerie(serie) : 'c:' + con[0].id;
  const cubre = (p, d) => p.desde <= d && (!p.hasta || d <= p.hasta) && tocaDia(p, d);
  const afectadas = db.pautas.filter(p => p.patientId === pid && pautaEnSesion(p, '') && fechas.some(d => cubre(p, d)));
  if (op === 'vacia' || op === 'copiar'){
    const grupos = new Map();
    for (const p of afectadas){
      if (op === 'copiar'){
        const ds = fechas.filter(d => cubre(p, d));
        const g = claveAsig(p);
        if (!grupos.has(g)) grupos.set(g, uid());
        db.pautas.push({ id: uid(), patientId: pid, exerciseId: p.exerciseId, asignacion: grupos.get(g), bloqueId: p.bloqueId || '', orden: p.orden || 0,
          desde: ds[0], hasta: serie ? p.hasta : ds[0], ...(serie && p.dias ? { dias: p.dias } : {}), sesion: token });
      }
      exceptuarSesion(p, token);   // '-' ya no toca en ninguna cita
    }
    return;
  }
  // asignar: lo que toca en todas ya toca en la cita; lo que era solo sin sesión ('-') pasa a la cita esos días.
  for (const p of afectadas.filter(x => x.sesion === '-')){
    const comun = { patientId: pid, exerciseId: p.exerciseId, asignacion: claveAsig(p), bloqueId: p.bloqueId || '', orden: p.orden || 0, sesion: token };
    let trozos = [p];
    const deCita = [];
    for (const d of fechas){
      const t = trozos.find(x => cubre(x, d)); if (!t) continue;
      const nuevos = [];
      if (t.desde < d) nuevos.push({ ...t, asignacion: claveAsig(t), hasta: addDays(d, -1) });
      if (!t.hasta || d < t.hasta) nuevos.push({ ...t, id: uid(), asignacion: claveAsig(t), desde: addDays(d, 1) });
      trozos = trozos.filter(x => x !== t).concat(nuevos);
      deCita.push({ id: uid(), ...comun, desde: d, hasta: d });
    }
    db.pautas = db.pautas.filter(x => x !== p).concat(trozos, deCita);
  }
  con.forEach(c => moverPuntSesion(c.patientId, c.fecha, '', c.id));
}

// El servidor hace la sincronización; aquí se pide cada pocos minutos y tras cambiar citas, y se aplican a las
// citas los cambios hechos en Google. gSync.estado es lo que devuelve /api/google/estado.
const gSync = { estado: null, ocupados: [], enCurso: false, error: '', ultima: null, timer: null, firma: null, esperandoConexion: null };
const googleActivo = () => !!(gSync.estado && gSync.estado.activo && gSync.estado.conectado);
async function cargarEstadoGoogle(){
  try {
    const r = await fetch('/api/google/estado'); if (!r.ok) return;
    gSync.estado = await r.json();
    gSync.ocupados = gSync.estado.ocupados || [];
    gSync.error = gSync.estado.error || '';
    gSync.ultima = gSync.estado.ultima;
  } catch (e) {}
  pintarEstadoGoogle();
}
// Lo que se sube a Google de las citas: si cambia tras guardar, toca sincronizar.
const firmaCitasGoogle = () => JSON.stringify([db.citas, db.patients.map(p => [p.id, p.nombre, p.apellidos]), db.ajustes.googleTitulo || '']);
function trasGuardar(){
  if (!googleActivo()) return;
  const f = firmaCitasGoogle();
  if (gSync.firma === null){ gSync.firma = f; return; }
  if (f === gSync.firma) return;
  gSync.firma = f;
  clearTimeout(gSync.timer); gSync.timer = setTimeout(() => sincronizarGoogle(false), 3000);
}
async function sincronizarGoogle(manual){
  if (gSync.enCurso || !loaded) return;
  if (!googleActivo()){ if (manual) irAjustesAgenda(); return; }
  gSync.enCurso = true; pintarEstadoGoogle();
  try {
    try { await saveChain; } catch (e) {}
    for (let vuelta = 0; vuelta < 30; vuelta++){
      const r = await fetch('/api/google/sincronizar', { method: 'POST' });
      if (r.status === 409) break;   // ya hay otra sincronización en marcha
      if (!r.ok) throw new Error((await r.text()).trim() || 'error del servidor');
      const res = await r.json();
      gSync.ocupados = res.ocupados || []; gSync.ultima = res.hora; gSync.error = '';
      if (res.cambios && res.cambios.length) aplicarCambiosGoogle(res.cambios);
      if (!res.pendientes) break;
    }
  } catch (e){
    gSync.error = e.message;
    if (manual) avisar('No se ha podido sincronizar con Google Calendar:\n\n' + e.message);
  } finally {
    gSync.enCurso = false;
    gSync.firma = firmaCitasGoogle();
    pintarEstadoGoogle(); refrescarAgenda();
    if (ui.view === 'ajustes' && ui.ajTab === 'agenda') pintarGoogleAjustes();
  }
}
// Cambios hechos en Google (citas movidas o borradas allí): se aplican aquí y se pueden deshacer.
function aplicarCambiosGoogle(cambios){
  const antes = instantanea();
  let movidas = 0, anuladas = 0;
  for (const x of cambios){
    const c = getCita(x.citaId); if (!c) continue;
    if (x.accion === 'anular'){ quitarCita(c); anuladas++; }
    else if (x.accion === 'mover' && x.fecha && /^\d\d:\d\d$/.test(x.hora || '')){
      Object.assign(c, { fecha: x.fecha, hora: x.hora, duracion: x.duracion || c.duracion }, c.serieId ? { modificada: true } : {});
      movidas++;
    }
  }
  if (!movidas && !anuladas) return;
  render();
  if ($('#modal #ctPac') && citaEd && citaEd.id && !getCita(citaEd.id)) closeModal();
  ofrecerDeshacer(antes, 'Desde Google Calendar: ' + [movidas ? plural(movidas, 'sesión cambiada', 'sesiones cambiadas') : '', anuladas ? plural(anuladas, 'sesión anulada', 'sesiones anuladas') : ''].filter(Boolean).join(' y '));
}
function haceTexto(t){
  if (!t) return '';
  const min = Math.round((Date.now() - new Date(t)) / 60000);
  return min < 1 ? 'ahora mismo' : min < 60 ? `hace ${plural(min, 'minuto', 'minutos')}` : 'a las ' + new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function leerClienteGoogle(input){
  const f = input.files[0]; input.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let j = null; try { j = JSON.parse(r.result); } catch (e) {}
    const c = j && (j.installed || j.web);
    if (!c || !c.client_id){ avisar('El archivo no es el JSON de un ID de cliente de Google (el que se descarga en Google Cloud › Clientes).'); return; }
    if (j.web) avisar('Ese ID de cliente es de tipo «Aplicación web». Tiene que ser de tipo «App de escritorio»: crea otro en Google Cloud.');
    $('#gCliente').value = c.client_id; $('#gSecreto').value = c.client_secret || '';
  };
  r.readAsText(f);
}
async function guardarClienteGoogle(){
  const r = await fetch('/api/google/credenciales', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clientId: $('#gCliente').value, clientSecret: $('#gSecreto').value }) });
  if (!r.ok){ avisar((await r.text()).trim()); return; }
  await cargarEstadoGoogle(); pintarGoogleAjustes();
}

// Manual: AYUDA.md (embebido en el programa) convertido a HTML con un intérprete mínimo:
// títulos «#»/«##»/«###» con ancla «{#id}», párrafos, listas «-» y «1.», notas «> …», **negrita** y enlaces [texto](#ancla).
let ayudaCache = null;
function cargarAyuda(){
  if (ayudaCache) return Promise.resolve(ayudaCache);
  return fetch('/api/ayuda').then(r => { if (!r.ok) throw new Error(); return r.text(); }).then(t => (ayudaCache = mdManual(t)));
}
function mdInline(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(#([a-z0-9-]+)\)/g, (m, txt, id) => `<a href="#${id}" onclick="irAyuda('${id}');return false">${txt}</a>`);
}
function mdManual(md){
  const toc = [], out = []; let lista = null, parrafo = [], seccion = false;
  const cierraP = () => { if (parrafo.length){ out.push(`<p>${mdInline(parrafo.join(' '))}</p>`); parrafo = []; } };
  const cierraL = () => { if (lista){ out.push(`<${lista.tipo}>${lista.items.map(i => `<li>${mdInline(i)}</li>`).join('')}</${lista.tipo}>`); lista = null; } };
  for (const linea of md.split(/\r?\n/)){
    const l = linea.trim(); let m;
    if (!l){ cierraP(); cierraL(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*?)(?:\s*\{#([a-z0-9-]+)\})?$/))){
      cierraP(); cierraL();
      const n = m[1].length, id = m[3] || '';
      if (n === 2){ if (seccion) out.push('</section>'); out.push(`<section data-id="${id}">`); seccion = true; toc.push({ id, t: m[2] }); }
      out.push(`<h${n}${id ? ` id="ay-${id}"` : ''}>${mdInline(m[2])}</h${n}>`);
    } else if ((m = l.match(/^>\s?(.*)$/))){
      cierraP(); cierraL();
      out.push(`<div class="nota${/^\*\*Importante/.test(m[1]) ? ' importante' : ''}">${mdInline(m[1])}</div>`);
    } else if ((m = l.match(/^[-*]\s+(.*)$/)) || (m = l.match(/^\d+\.\s+(.*)$/))){
      cierraP();
      const tipo = /^\d/.test(l) ? 'ol' : 'ul';
      if (lista && lista.tipo !== tipo) cierraL();
      if (!lista) lista = { tipo, items: [] };
      lista.items.push(m[1]);
    } else { cierraL(); parrafo.push(l); }
  }
  cierraP(); cierraL(); if (seccion) out.push('</section>');
  return { html: out.join('\n'), toc };
}
function viewAyuda(){
  return `<div class="card"><div class="ayuda-wrap">
    <nav class="ayuda-toc" aria-label="Índice del manual">
      <input type="search" id="ayudaBuscar" placeholder="Buscar en el manual" value="${esc(ui.qAyuda || '')}" oninput="ui.qAyuda=this.value; filtrarAyuda()" style="margin-bottom:8px">

// Buscador del manual: oculta las secciones que no contienen todas las palabras y resalta el índice.
function filtrarAyuda(){
  const q = ui.qAyuda || '';
  let visibles = 0;
  document.querySelectorAll('#manual section').forEach(sec => {
    const ok = !q.trim() || coincideQ(q, sec.textContent);
    sec.classList.toggle('oculto', !ok); if (ok) visibles++;
    const a = document.querySelector(`#ayudaIndice a[data-id="${sec.dataset.id}"]`); if (a) a.style.display = ok ? '' : 'none';
  });
  let nada = $('#ayudaNada');
  if (!visibles && q.trim()){ if (!nada){ nada = document.createElement('p'); nada.id = 'ayudaNada'; nada.className = 'muted'; $('#manual').appendChild(nada); } nada.textContent = 'Ninguna sección del manual contiene esas palabras.'; }
  else if (nada) nada.remove();
}

/* ---------- novedades (changelog) ---------- */
let changelogCache = null;
function cargarChangelog(){
  if (changelogCache) return Promise.resolve(changelogCache);
  return fetch('/api/changelog').then(r => r.json()).then(c => (changelogCache = { version: c.version, versiones: parseChangelog(c.texto || '') }));
}
// Formato: «## 1.2.0 · 25 oct 2026», secciones «### Novedades» y viñetas «- texto» (con **negrita**).
function parseChangelog(md){
  const vs = []; let v = null, sec = null;
  md.split(/\r?\n/).forEach(l => {
    let m;
    if ((m = l.match(/^##\s+(\S+)(?:\s*·\s*(.*))?$/))){ v = { version: m[1], fecha: (m[2] || '').trim(), secciones: [] }; vs.push(v); sec = null; }
    else if (v && (m = l.match(/^###\s+(.*)$/))){ sec = { titulo: m[1].trim(), items: [] }; v.secciones.push(sec); }
    else if (v && (m = l.match(/^[-*]\s+(.*)$/))){ if (!sec){ sec = { titulo: '', items: [] }; v.secciones.push(sec); } sec.items.push(m[1]); }
  });
  return vs;
}
const mdLinea = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
function versionHTML(v, actual, abierta){
  return `<details class="sec" ${abierta ? 'open' : ''}><summary>Versión ${esc(v.version)}${v.fecha ? ` <span class="muted">· ${esc(v.fecha)}</span>` : ''}${v.version === actual ? ' <span class="nivel">Instalada</span>' : ''}</summary>
    ${v.secciones.map(s => `${s.titulo ? `<h3>${esc(s.titulo)}</h3>` : ''}<ul>${s.items.map(i => `<li>${mdLinea(i)}</li>`).join('')}</ul>`).join('')}</details>`;
}
function loadNovedades(){
  cargarChangelog().then(c => {
    const el = $('#novedades'); if (!el) return;
    el.innerHTML = c.versiones.length
      ? c.versiones.map((v, i) => versionHTML(v, c.version, v.version === c.version || (i === 0 && !c.versiones.some(x => x.version === c.version)))).join('')
      : '<p class="muted">No hay novedades registradas.</p>';
  }).catch(() => { const el = $('#novedades'); if (el) el.textContent = 'No se pudieron cargar las novedades.'; });
}

/* ---------- bloqueo mientras se hace una copia ---------- */
let bloqueoLocal = false, bloqueoServidor = false;
function actualizarBloqueo(){
  const activo = bloqueoLocal || bloqueoServidor;
  const el = $('#bloqueo');
  if (el) el.hidden = !activo;
  // inert impide también el teclado y el foco en lo que queda detrás del aviso.
  for (const sel of ['header', '#main', '#modal']){ const x = document.querySelector(sel); if (x) x.inert = activo; }

/* ---------- exportación a PDF ---------- */
// Un PDF por paciente: cabecera con el nombre, gráfica de la puntuación media diaria y el detalle de cada
// día (bloques y ejercicios en orden de ejecución, con la puntuación de cada repetición y su media).
// Se genera aquí con pdf-lib (incluida en la app, sin internet) y el servidor lo guarda donde elija el usuario.
function cargarPdfLib(){
  if (window.PDFLib) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = '/pdf-lib.min.js';
    s.onload = ok;
    s.onerror = () => ko(new Error('No se ha podido cargar la librería de PDF.'));
    document.head.appendChild(s);
  });
}
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); }
// Nombre por defecto de un PDF: «Apellidos_Nombre_Tipo_desde_hasta», con guiones bajos en lugar de espacios.
function nombrePdf(partes){ return partes.map(x => String(x || '').trim().replace(/\s+/g, '_')).filter(Boolean).join('_'); }
function diasEntre(a, b){ return Math.round((fromIso(b) - fromIso(a)) / 86400000); }
function fechaLargaPdf(s){ const t = fmtLong(s); return t.charAt(0).toUpperCase() + t.slice(1); }
function fechaCortaPdf(s){ return fromIso(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }); }

// Datos del informe: por cada día con pauta, sus grupos (bloque o ejercicios sueltos) y ejercicios.
// Por día, una entrada por sesión (titulo: «Cita 10:00–10:45», «Sin cita» o '' si el día tiene una sola sesión sin
// cita) con sus grupos de ejercicios. La gráfica usa la media del día (todas las sesiones juntas).
function datosPdf(p, desde, hasta){
  const dias = [], puntos = [];
  for (let s = desde; s <= hasta; s = addDays(s, 1)){
    const sesiones = sesionesDia(p.id, s).map(x => ({ x, lista: exercisesSesion(p.id, s, x.id) })).filter(y => y.lista.length);
    if (!sesiones.length) continue;
    const ses = sesiones.map(({ x, lista }) => {
      const grupos = new Map();
      for (const { pauta, exercise } of lista){
        const k = pauta.bloqueId || '__sueltos';
        if (!grupos.has(k)){
          const b = pauta.bloqueId ? db.bloques.find(y => y.id === pauta.bloqueId) : null;
          grupos.set(k, { titulo: pauta.bloqueId ? (b ? b.nombre : 'Bloque') : 'Ejercicios sueltos', nivel: b ? b.nivel : '', bloque: b || null, items: [] });
        }
        const vals = repsDe(p.id, s, exercise.id, x.id).map(r => r.valor);
        const puntuadas = vals.filter(v => v !== null && v !== undefined);
        grupos.get(k).items.push({ nombre: nombreEnBloque(exercise.nombre, grupos.get(k).bloque) || exercise.nombre, reps: vals, media: puntuadas.length ? puntuadas.reduce((a, b) => a + b, 0) / puntuadas.length : null });
      }
      return { titulo: sesiones.length > 1 || x.cita ? etiquetaSesion(x) : '', grupos: [...grupos.values()] };
    });
    const medias = exercisesOn(p.id, s).map(it => resumenDia(p.id, s, it.exercise.id).avg).filter(m => m !== null);
    dias.push({ fecha: s, sesiones: ses });
    if (medias.length) puntos.push({ fecha: s, media: medias.reduce((a, b) => a + b, 0) / medias.length });
  }
  return { dias, puntos };
}

// Observaciones de sesión de un periodo, por fecha y hora de la sesión (para el informe de pautas).
function obsPeriodoPdf(pid, desde, hasta){
  const out = [];
  for (let s = desde; s <= hasta; s = addDays(s, 1)) for (const { o, cita } of obsSesionesDia(pid, s))
    out.push({ fecha: s, titulo: cita ? etiquetaSesion({ cita }) : (citasDia(pid, s).length ? 'Sin sesión' : ''), texto: o.texto.trim() });
  return out;
}

    if (e.ids.length > 1){
      // Varios pacientes: se elige la carpeta una sola vez y cada PDF va dentro con su nombre.
      estadoExp('Elige la carpeta donde guardar los PDF (el diálogo puede aparecer detrás de esta ventana)…', true);
      carpeta = await elegirCarpetaPdf();
      if (!carpeta) cancelado = true;
    }
    if (!cancelado){
      estadoExp('Preparando…', true);
      await cargarPdfLib();
      for (let i = 0; i < e.ids.length; i++){
        const p = getP(e.ids[i]);
        estadoExp(`Generando ${i + 1} de ${e.ids.length}: ${esc(p.nombre + ' ' + p.apellidos)}…` + (carpeta ? '' : '<br>Elige dónde guardarlo (el diálogo puede aparecer detrás de esta ventana).'), true);
        await new Promise(r => setTimeout(r, 30));   // deja pintar el estado antes del trabajo pesado
        try {
          const bytes = await pdfPaciente(p, e.desde, e.hasta, { detalle: e.detalle !== false, observaciones: e.obs !== false });
          const descripcion = (e.nombre || '').trim();
          const nombre = nombrePdf([p.apellidos, p.nombre, descripcion, 'Informe de pautas', e.desde, e.hasta]);
          const info = await guardarPdf(bytes, nombre, carpeta);   // con carpeta, el servidor no pisa archivos con el mismo nombre
          if (!info){ cancelado = true; break; }
          hechos.push(registrarInforme(p, 'informe', info, e.desde, e.hasta, descripcion));
        } catch (err){
          fallos.push(`${p.nombre} ${p.apellidos}: ${err.message}`);
        }
      }
    }
  } catch (err){
    fallos.push(err.message);
  }
  e.ocupado = false;
  if (hechos.length && ui.view === 'paciente') render();   // la lista de «Informes» de debajo se actualiza
  let html = '';
  if (hechos.length === 1) html = `<p><strong>Guardado:</strong> <code>${esc(hechos[0].ruta)}</code></p>
    <p class="row"><button class="btn small" onclick="abrirInforme('${hechos[0].id}')">Abrir PDF</button><button class="ghost small" onclick="abrirInforme('${hechos[0].id}', 'carpeta')">Mostrar en la carpeta</button></p>`;
  else if (hechos.length) html = `<p><strong>Listo:</strong> ${hechos.length} PDF en <code>${esc(carpeta)}</code>.</p>
    <p class="row"><button class="ghost small" onclick="abrirInforme('${hechos[0].id}', 'carpeta')">Abrir la carpeta</button></p>`;
  if (cancelado && !hechos.length && !fallos.length) html = '<p>No se ha guardado nada.</p>';
  else if (cancelado) html += '<p>Se canceló antes de terminar.</p>';
  if (fallos.length) html += `<p style="color:var(--danger)"><strong>No se han podido crear:</strong><br>${fallos.map(esc).join('<br>')}</p>`;
  estadoExp(html, false);
}

// Envía el PDF al servidor. Sin carpeta, el servidor abre el diálogo «Guardar como» del sistema.
// Devuelve { path, nombre, carpeta } o null si el usuario cancela.
async function guardarPdf(bytes, nombre, carpeta){
  const q = new URLSearchParams({ nombre });
  if (carpeta) q.set('carpeta', carpeta); else q.set('inicio', db.ajustes.pdfCarpeta || '');
  const r = await fetch('/api/exportar?' + q, { method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: new Blob([bytes], { type: 'application/pdf' }) });
  if (r.status === 409) return null;
  if (!r.ok) throw new Error((await r.text()).trim() || 'error del servidor');
  return r.json();
}
async function elegirCarpetaPdf(){
  const q = new URLSearchParams({ titulo: 'Elige la carpeta donde guardar los PDF', inicio: db.ajustes.pdfCarpeta || '' });
  const r = await fetch('/api/elegir-carpeta?' + q, { method: 'POST' });
  if (r.status === 409) return '';
  if (!r.ok) throw new Error((await r.text()).trim() || 'error del servidor');
  return (await r.json()).path || '';
}
function registrarInforme(p, tipo, info, desde, hasta, descripcion){
  const x = { id: uid(), patientId: p.id, tipo, nombre: info.nombre, ruta: info.path, fecha: new Date().toISOString(), desde: desde || '', hasta: hasta || '', descripcion: descripcion || '' };
  db.informes.push(x);
  if (ui.infExiste) ui.infExiste[x.id] = true;
  db.ajustes.pdfCarpeta = info.carpeta;   // la próxima vez el diálogo empieza en la misma carpeta
  save();
  return x;
}

// Reduce la foto (lado mayor 1600 px, JPEG) para que no pese demasiado.
function fotoABlob(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('no se pudo convertir')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('no se puede leer esta imagen')); };
    img.src = url;
  });
}
async function subirFotos(clave, input){
  const files = [...input.files]; input.value = '';
  const estado = $('#fotosEstado-' + clave), fallos = [];
  for (let i = 0; i < files.length; i++){
    if (estado) estado.textContent = `Subiendo ${i + 1} de ${files.length}…`;
    try {
      const r = await fetch('/api/foto', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: await fotoABlob(files[i]) });
      if (!r.ok) throw new Error((await r.text()).trim() || 'error del servidor');
      const { url } = await r.json();
      if (!listaFotos(clave).includes(url)) listaFotos(clave).push(url);
      pintarFotos(clave);
    } catch (e){ fallos.push(`${files[i].name}: ${e.message}`); }
  }
  const est2 = $('#fotosEstado-' + clave); if (est2) est2.textContent = '';
  if (fallos.length) avisar('No se han podido añadir estas fotos:\n' + fallos.join('\n'));
}

/* ---------- plan en casa: los planes de cada paciente ---------- */
// Un paciente tiene una lista de planes en casa. Cada plan tiene nombre, fecha de inicio, duración en semanas,
// fecha de fin (se calcula con la duración; se puede retocar a mano sin cambiar la duración), notas y ejercicios.
// Los ejercicios usan el mismo formato que las plantillas: «dia» cuenta desde el lunes de la semana en que empieza
// el plan (1 = ese lunes, 8 = el lunes siguiente…) y dia 0 son los ejercicios «a elegir», sin día fijo.
// El mismo editor sirve para un plan y para una plantilla (docActual() devuelve el que se está editando).
const claveGrupoCasa = i => i.grupo || (i.bloqueId ? 'b:' + i.bloqueId : '');
// Los ejercicios de un bloque suelen llevar el nombre del bloque delante («Caminar con los muslos – Por los
// tobillos»). Bajo el título del bloque se muestra solo la parte propia; si queda vacía, es el mismo nombre.
function nombreEnBloque(nombre, b){
  if (!b) return nombre;
  const bn = (b.nombre || '').trim();
  if (!bn || nombre.toLowerCase().slice(0, bn.length) !== bn.toLowerCase()) return nombre;
  return nombre.slice(bn.length).replace(/^[\s\-–—:·.,]+/, '').trim();
}
// Con el buscador: un bloque cuyo nombre coincide se muestra entero; si no, solo los ejercicios que coinciden.
function filtrarGruposCasa(grupos, q){
  if (!q || !q.trim()) return grupos;
  const out = [];
  for (const g of grupos){
    const b = g.clave && g.bloqueId ? db.bloques.find(x => x.id === g.bloqueId) : null;
    const items = g.items.filter(it => coincideQ(q, getE(it.exerciseId).nombre + ' ' + (b ? b.nombre : '')));
    if (items.length) out.push({ ...g, items });
  }
  return out;
}
const DIAS_NOM = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MESES_NOM = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const diaSemana = s => ((fromIso(s).getDay() + 6) % 7) + 1;   // 1 = lunes … 7 = domingo
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
function resumenItems(items){
  const its = items.filter(i => getE(i.exerciseId));
  const libres = its.filter(i => i.dia === 0).length, dias = new Set(its.filter(i => i.dia > 0).map(i => i.dia)).size;
  return `${plural(its.length - libres, 'ejercicio', 'ejercicios')} en ${plural(dias, 'día', 'días')}${libres ? ` y ${libres} a elegir` : ''}`;
}

// --- fechas de un plan ---
const esPlan = t => !!(t && t.patientId);
const planesDe = pid => db.planes.filter(x => x.patientId === pid);
// --- duración en días, semanas o meses (planes y plantillas) ---
const UNIDADES_DUR = [['dias', 'días'], ['semanas', 'semanas'], ['meses', 'meses']];
const MAX_DUR = { dias: 730, semanas: 104, meses: 24 };
const unidadDe = x => MAX_DUR[x.unidad] ? x.unidad : 'semanas';
const duracionDe = x => Math.max(1, Math.min(MAX_DUR[unidadDe(x)], x.duracion || (unidadDe(x) === 'semanas' ? x.semanas : 0) || 1));
// Un mes más (el 31 de enero + 1 mes es el 28 o 29 de febrero).
function sumarMeses(s, n){ const [y, m, d] = s.split('-').map(Number); return iso(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate()))); }
// Último día de un periodo que empieza en «inicio» y dura n días, semanas o meses.
const finDuracion = (inicio, n, u) => u === 'dias' ? addDays(inicio, n - 1) : u === 'meses' ? addDays(sumarMeses(inicio, n), -1) : addDays(inicio, 7 * n - 1);
const textoDuracion = (n, u) => u === 'dias' ? plural(n, 'día', 'días') : u === 'meses' ? plural(n, 'mes', 'meses') : plural(n, 'semana', 'semanas');
const textoDuracionDe = x => textoDuracion(duracionDe(x), unidadDe(x));
// Duración aproximada en días (para ordenar plantillas de distinta unidad).
const diasPlantilla = x => duracionDe(x) * ({ dias: 1, semanas: 7, meses: 30 }[unidadDe(x)] || 7);
// Semanas de lunes a domingo de una plantilla con esa duración (un mes cuenta como 4 semanas).
const semanasDeDuracion = (n, u) => Math.min(104, u === 'dias' ? Math.ceil(n / 7) : u === 'meses' ? 4 * n : n);
function duracionHTML(id, n, u, cambio){
  return `<div><label for="${id}N">Duración</label><div class="row dur">
    <input type="number" id="${id}N" min="1" max="${MAX_DUR[u]}" value="${n}" ${cambio}>
    <select id="${id}U" aria-label="Unidad de la duración" data-prev="${u}" ${cambio.replace(/on(change|input)="/g, '$&convertirDuracion(\'' + id + '\'); ')}>${UNIDADES_DUR.map(([v, t]) => `<option value="${v}" ${u === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>`;
}
// Al cambiar de unidad se convierte el número para que la duración quede parecida (2 semanas → 14 días).
function convertirDuracion(id){
  const sel = $('#' + id + 'U'), inp = $('#' + id + 'N'); if (!sel || !inp || sel.dataset.prev === sel.value) return;
  const aDias = { dias: 1, semanas: 7, meses: 30 }, d = (parseInt(inp.value, 10) || 1) * aDias[sel.dataset.prev];
  inp.value = Math.max(1, Math.min(MAX_DUR[sel.value], Math.round(d / aDias[sel.value])));
  inp.max = MAX_DUR[sel.value]; sel.dataset.prev = sel.value;
}
function leerDuracion(id){
  const u = MAX_DUR[$('#' + id + 'U').value] ? $('#' + id + 'U').value : 'semanas';
  return { u, n: Math.max(1, Math.min(MAX_DUR[u], parseInt($('#' + id + 'N').value, 10) || 1)) };
}
const lunesPlan = pl => iso(inicioSemana(fromIso(pl.inicio)));
const finAutoPlan = pl => finDuracion(pl.inicio, duracionDe(pl), unidadDe(pl));
const primerDiaPlan = pl => diaSemana(pl.inicio);                       // «dia» del día de inicio (1…7)
const ultimoDiaPlan = pl => diasEntre(lunesPlan(pl), finAutoPlan(pl)) + 1;
const diaEnPlan = (pl, dia) => dia >= primerDiaPlan(pl) && dia <= ultimoDiaPlan(pl);
const fechaDiaPlan = (pl, dia) => addDays(lunesPlan(pl), dia - 1);
const semanasCalendario = pl => Math.ceil(ultimoDiaPlan(pl) / 7);     // semanas de lunes a domingo que ocupa
const textoSemanas = n => plural(n, 'semana', 'semanas');
function estadoPlan(pl){ const t = todayIso(); return pl.inicio > t ? 'proximo' : pl.fin < t ? 'terminado' : 'en-curso'; }
const ESTADOS_PLAN = { 'en-curso': 'En curso', proximo: 'Próximo', terminado: 'Terminado' };
const estadoPlanHTML = pl => `<span class="estado-plan ${estadoPlan(pl)}">${ESTADOS_PLAN[estadoPlan(pl)]}</span>`;
function resumenPlan(pl){
  const its = pl.items.filter(i => getE(i.exerciseId));
  const libres = its.filter(i => i.dia === 0).length, dias = new Set(its.filter(i => i.dia > 0).map(i => i.dia)).size;
  return `${plural(dias, 'día', 'días')} · ${plural(its.length - libres, 'ejercicio', 'ejercicios')}${libres ? ` · ${libres} a elegir` : ''}`;
}

function docActual(){
  if (ui.view === 'paciente' && ui.tabP === 'casa' && ui.planCasaId) return db.planes.find(x => x.id === ui.planCasaId) || null;
  return db.plantillas.find(x => x.id === ui.plantillaId) || null;

const semanasDoc = t => esPlan(t) ? semanasCalendario(t) : semanasPl(t);
// Nombre de un día para títulos y avisos: «A elegir», «Lunes, 26 de octubre de 2026» (plan) o «Semana 2 · Lunes» (plantilla).
const nombreDiaPl = (t, dia) => dia === 0 ? 'A elegir' : esPlan(t) ? fechaLargaPdf(fechaDiaPlan(t, dia))
  : (semanasPl(t) > 1 ? `Semana ${Math.floor((dia - 1) / 7) + 1} · ` : '') + DIAS_NOM[(dia - 1) % 7];
const delDiaPl = (t, dia) => dia === 0 ? 'de «A elegir»' : 'del ' + nombreDiaPl(t, dia).toLowerCase();
// Día de la plantilla (1 … 7·semanas) que corresponde a una fecha, contando las semanas desde la de inicio.
function diaPlantillaDe(t, f, ini){
  const w = Math.floor(diasEntre(iso(inicioSemana(fromIso(ini))), iso(inicioSemana(fromIso(f)))) / 7) % semanasPl(t);
  return diaSemana(f) + 7 * w;
}

// Un plan coincide si su nombre contiene las palabras buscadas y sus fechas (inicio – fin) tocan el intervalo, el mes y el año elegidos.
function filtrarPlanes(lista, f){
  const q = norm(f.q).split(/\s+/).filter(Boolean);
  const toca = (x, a, b) => !(x.fin < a || x.inicio > b);
  return lista.filter(x => {
    if (!q.every(w => norm(x.nombre).includes(w))) return false;
    if (f.desde && x.fin < f.desde) return false;
    if (f.hasta && x.inicio > f.hasta) return false;
    if (f.anio && f.mes){ const a = `${f.anio}-${f.mes}-01`; if (!toca(x, a, addDays(iso(new Date(+f.anio, +f.mes, 1)), -1))) return false; }
    else if (f.anio){ if (!toca(x, f.anio + '-01-01', f.anio + '-12-31')) return false; }
    else if (f.mes){
      let ok = false;
      for (let y = +x.inicio.slice(0, 4); y <= +x.fin.slice(0, 4) && !ok; y++){ const a = `${y}-${f.mes}-01`; ok = toca(x, a, addDays(iso(new Date(y, +f.mes, 1)), -1)); }
      if (!ok) return false;
    }
    return true;
  });
}

// Al repintar se quita el campo que tenía el foco y el navegador puede lanzar otro «change» a mitad: se ignora.
let guardandoCabecera = false;
async function guardarCabeceraPlan(){
  if (guardandoCabecera) return;
  guardandoCabecera = true;
  try { await guardarCabeceraPlan0(); } finally { guardandoCabecera = false; }
}
async function guardarCabeceraPlan0(){
  const antes = instantanea();
  const pl = docActual(); if (!esPlan(pl)) return;
  const restaurar = () => { $('#pcNombre').value = pl.nombre; $('#pcIni').value = pl.inicio; $('#pcDurN').value = duracionDe(pl); $('#pcDurU').value = unidadDe(pl); $('#pcFin').value = pl.fin; };
  const nombre = $('#pcNombre').value.trim(), ini = $('#pcIni').value;
  if (!nombre){ avisar('El nombre del plan no puede quedar vacío.'); restaurar(); return; }
  if (!ini){ avisar('Indica la fecha en que empieza el plan.'); restaurar(); return; }
  const { n, u } = leerDuracion('pcDur');
  const nuevo = { ...pl, inicio: ini, duracion: n, unidad: u };
  let fin = $('#pcFin').value, manual = !!pl.finManual;
  const cambiaFechas = ini !== pl.inicio || n !== duracionDe(pl) || u !== unidadDe(pl), cambiaFin = fin !== pl.fin;
  if (cambiaFin && !cambiaFechas){
    if (!fin) manual = false;
    else if (fin < ini){ avisar('La fecha de fin no puede ser anterior a la de inicio.'); restaurar(); return; }
    else manual = fin !== finAutoPlan(nuevo);
  }
  if (!manual || !fin || fin < ini){ fin = finAutoPlan(nuevo); manual = false; }
  // Los ejercicios van con su semana: si el plan empieza otra semana, se mueven con él. Los que caen fuera, se quitan.
  const fuera = pl.items.filter(i => i.dia > 0 && getE(i.exerciseId) && !diaEnPlan(nuevo, i.dia));
  if (fuera.length && !await preguntar(`Con estas fechas, ${plural(fuera.length, 'ejercicio queda', 'ejercicios quedan')} fuera del plan y se ${fuera.length === 1 ? 'quitará' : 'quitarán'}.\n\n¿Continuar?`, { boton: 'Continuar' })){ restaurar(); return; }
  const repinta = cambiaFechas || cambiaFin || nombre !== pl.nombre;
  pl.nombre = nombre; pl.inicio = ini; pl.duracion = n; pl.unidad = u; pl.semanas = semanasCalendario(nuevo); pl.fin = fin; pl.finManual = manual; pl.notas = $('#pcNotas').value.trim();
  if (fuera.length) pl.items = pl.items.filter(i => !fuera.includes(i));
  if (repinta) render(); else save();   // las notas se guardan sin repintar (no se pierde el foco)
  if (fuera.length) ofrecerDeshacer(antes, 'Ejercicios fuera del plan quitados');
}
function recalcularFinPlan(){
  const pl = docActual(); if (!esPlan(pl)) return;
  pl.finManual = false; pl.fin = finAutoPlan(pl); render();
}
// «Duplicar»: el mismo plan, empezando justo al día siguiente de su fin calculado. Cada ejercicio queda a la
// misma distancia del inicio (con semanas, el mismo día de la semana).
function duplicarPlanCasa(id){
  const pl = db.planes.find(x => x.id === id); if (!pl) return;
  const inicio = addDays(finAutoPlan(pl), 1);
  const desp = diaSemana(inicio) - primerDiaPlan(pl);
  const grupos = {};
  const copia = { ...pl, id: uid(), nombre: pl.nombre + ' (copia)', inicio, fin: '', finManual: false, creado: todayIso(),
    items: pl.items.filter(i => getE(i.exerciseId)).map(i => ({ ...i, id: uid(), dia: i.dia ? i.dia + desp : 0, grupo: i.grupo ? (grupos[i.grupo] = grupos[i.grupo] || uid()) : '' })) };
  copia.fin = finAutoPlan(copia);
  db.planes.push(copia);
  abrirPlanCasa(copia.id);
  ui.casaExpMsg = ['', `Copia creada: empieza el ${fmt(inicio)}. Cambia el nombre y las fechas si hace falta.`]; render();
  setTimeout(() => { const i = $('#pcNombre'); if (i){ i.focus(); i.select(); } }, 30);
}
async function delPlanCasa(id){
  const antes = instantanea();
  const pl = db.planes.find(x => x.id === id); if (!pl) return;
  if (!await preguntar(`¿Eliminar el plan «${pl.nombre}» (del ${fmt(pl.inicio)} al ${fmt(pl.fin)})?\n\nLos PDF que ya se hayan generado no se borran.`, { boton: 'Eliminar plan', peligro: true })) return;
  db.planes = db.planes.filter(x => x.id !== id);
  if (ui.planCasaId === id) ui.planCasaId = null;
  render();
  ofrecerDeshacer(antes, `Plan «${pl.nombre}» eliminado`);
}
async function vaciarPlanCasa(id){
  const antes = instantanea();
  const pl = db.planes.find(x => x.id === id); if (!pl) return;
  const n = pl.items.filter(i => getE(i.exerciseId)).length; if (!n) return;

function textoPlantilla(t){
  const partes = [t.nombre];
  for (const i of t.items){
    const b = i.bloqueId ? db.bloques.find(x => x.id === i.bloqueId) : null, e = getE(i.exerciseId);
    if (b) partes.push(b.nombre);
    if (e) partes.push(e.nombre);
  }
  return norm(partes.join(' '));
}
// Muestra u oculta los elementos con data-n según el texto buscado (todas las palabras deben aparecer).
function filtrarPorTexto(selector, vacioSel, valor){
  const q = norm(valor).split(/\s+/).filter(Boolean);
  let n = 0;
  document.querySelectorAll(selector).forEach(el => {
    const ok = q.every(w => (el.dataset.n || '').includes(w));
    el.style.display = ok ? '' : 'none'; if (ok) n++;
  });
  const v = $(vacioSel); if (v) v.style.display = n ? 'none' : 'block';
}

function plantillaContenidoHTML(t){
  const dias = [];
  for (let d = 0; d <= 7 * semanasPl(t); d++){
    const its = t.items.filter(i => i.dia === d && getE(i.exerciseId)).sort((a, b) => a.orden - b.orden);
    if (!its.length) continue;
    const grupos = [];
    for (const it of its){
      const ult = grupos[grupos.length - 1];
      if (it.grupo && ult && ult.clave === it.grupo) ult.items.push(it); else grupos.push({ clave: it.grupo, bloqueId: it.bloqueId, nota: it.notaGrupo, items: [it] });
    }
    const filas = grupos.map(g => {
      const ej = (it, b) => `<li>${esc(nombreEnBloque(getE(it.exerciseId).nombre, b) || getE(it.exerciseId).nombre)}${it.nota ? ` <span class="muted">— ${esc(it.nota)}</span>` : ''}</li>`;
      if (!g.clave) return `<ul class="lista-bloque">${ej(g.items[0], null)}</ul>`;
      const b = g.bloqueId ? db.bloques.find(x => x.id === g.bloqueId) : null;
      return `<div style="margin-left:4px"><strong>${esc(b ? b.nombre : 'Bloque')}</strong>${g.nota ? ` <span class="muted">— ${esc(g.nota)}</span>` : ''}<ul class="lista-bloque">${g.items.map(it => ej(it, b)).join('')}</ul></div>`;
    }).join('');
    dias.push(`<div class="pl-dia"><div class="pl-dia-t">${nombreDiaPl(t, d)}</div>${filas}</div>`);
  }
  return `${t.notas ? `<p class="muted" style="white-space:pre-wrap;margin:6px 0">Notas: ${esc(t.notas)}</p>` : ''}<div class="pl-semana">${dias.join('') || '<p class="muted">Sin ejercicios.</p>'}</div>`;
}
// Plan nuevo de un paciente con el contenido de una plantilla, repitiéndola hasta cubrir la duración.
function planDesdePlantilla(t, pid, nombre, inicio, duracion, unidad){
  const pl = { id: uid(), patientId: pid, nombre, inicio, duracion, unidad, semanas: 1, fin: '', finManual: false, notas: t.notas || '', creado: todayIso(), plantillaId: t.id, items: [] };
  pl.fin = finAutoPlan(pl); pl.semanas = semanasCalendario(pl);
  const copia = (it, dia, grupos) => pl.items.push({ id: uid(), dia, exerciseId: it.exerciseId, bloqueId: it.bloqueId || '', orden: it.orden, nota: it.nota || '',
    grupo: it.grupo ? (grupos[it.grupo] = grupos[it.grupo] || uid()) : '', notaGrupo: it.notaGrupo || '' });
  const g0 = {};
  t.items.filter(i => i.dia === 0 && getE(i.exerciseId)).forEach(it => copia(it, 0, g0));
  for (let dia = primerDiaPlan(pl); dia <= ultimoDiaPlan(pl); dia++){
    const td = diaPlantillaDe(t, fechaDiaPlan(pl, dia), inicio), grupos = {};
    t.items.filter(i => i.dia === td && getE(i.exerciseId)).sort((a, b) => a.orden - b.orden).forEach(it => copia(it, dia, grupos));
  }
  return pl;
}

async function guardarCabeceraPl0(){
  const antes = instantanea();
  const t = plantillaActual(); if (!t) return;
  const n = $('#plNombre').value.trim();
  if (!n){ avisar('El nombre no puede quedar vacío.'); $('#plNombre').value = t.nombre; return; }
  // Las semanas de la cuadrícula solo se recalculan si cambia la duración (una plantilla guardada desde un plan
  // que empieza a mitad de semana puede ocupar una semana más).
  const dur = leerDuracion('plDur'), cambiaDur = dur.n !== duracionDe(t) || dur.u !== unidadDe(t);
  const sem = cambiaDur ? semanasDeDuracion(dur.n, dur.u) : semanasPl(t);
  const sobran = t.items.filter(i => i.dia > 7 * sem);
  if (sobran.length && !await preguntar(`Al reducir la plantilla a ${textoDuracion(dur.n, dur.u)} se quitarán ${plural(sobran.length, 'ejercicio', 'ejercicios')} de las semanas que sobran. ¿Continuar?`)){ $('#plDurN').value = duracionDe(t); $('#plDurU').value = unidadDe(t); return; }
  const cambiaSemanas = sem !== semanasPl(t) || dur.n !== duracionDe(t) || dur.u !== unidadDe(t);
  t.nombre = n; t.semanas = sem; t.duracion = dur.n; t.unidad = dur.u; t.ciclo = 1; t.notas = ($('#plNotas') ? $('#plNotas').value.trim() : t.notas || '');
  if (sobran.length) t.items = t.items.filter(i => i.dia <= 7 * sem);
  if (cambiaSemanas) render(); else save();   // sin repintar si solo cambia el nombre: no se pierde el foco del otro campo
  if (sobran.length) ofrecerDeshacer(antes, 'Semanas quitadas de la plantilla');
}

const fmtCorta = s => fromIso(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

function anadirPl(){
  const t = docActual(); if (!t || !edPl) return;
  const { bloqueIds, exIds } = leerSeleccionModal();
  const libres = $('#acLibre').value.split('\n').map(x => x.trim()).filter(Boolean);
  if (!bloqueIds.length && !exIds.length && !libres.length){ avisar('Selecciona al menos un bloque o un ejercicio, o escribe uno.'); return; }
  const dias = edPl.edicion || edPl.dia === 0 ? [edPl.dia] : [...document.querySelectorAll('#modal .acDia:checked')].map(c => parseInt(c.value, 10));
  if (!dias.length){ avisar('Marca al menos un día.'); return; }
  const nota = $('#acNota').value.trim();
  for (const dia of dias){
    const presentes = new Set(t.items.filter(i => i.dia === dia).map(i => i.exerciseId));
    let orden = Math.max(0, ...t.items.filter(i => i.dia === dia).map(i => i.orden)) + 1;
    for (const bid of bloqueIds){
      const b = db.bloques.find(x => x.id === bid); if (!b) continue;
      const eids = b.ejercicios.filter(e => getE(e) && !presentes.has(e));
      if (!eids.length) continue;
      const grupo = uid();
      for (const eid of eids){ presentes.add(eid); t.items.push({ id: uid(), dia, exerciseId: eid, bloqueId: bid, orden: orden++, nota: '', grupo, notaGrupo: nota }); }
    }
    for (const nombre of libres){
      const eid = uid();
      db.exercises.push({ id: eid, nombre, libre: true });
      t.items.push({ id: uid(), dia, exerciseId: eid, bloqueId: '', orden: orden++, nota, grupo: '', notaGrupo: '' });
    }
    for (const eid of exIds){
      if (presentes.has(eid)) continue;
      presentes.add(eid);
      t.items.push({ id: uid(), dia, exerciseId: eid, bloqueId: '', orden: orden++, nota, grupo: '', notaGrupo: '' });
    }
  }
  render();
  if (edPl.edicion) openDiaPl(edPl.dia); else closeModal();
}

async function quitarPl(id, grupo, confirmar){

function moverPl(id, dir){

async function exportarPlan(pid, planId){

async function incrustarImagen(doc, dataUrl){
  if (!dataUrl) return null;
  try {
    const bin = atob(dataUrl.split(',')[1]);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return dataUrl.startsWith('data:image/png') ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
  } catch (err){ return null; }
}
async function pdfPlanCasa(p, pl){
  const delDia = d => pl.items.filter(x => x.dia === d && getE(x.exerciseId)).sort((a, b) => a.orden - b.orden);
  await cargarPdfLib();
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const nombreCompleto = `${p.nombre} ${p.apellidos}`.replace(/\s+/g, ' ').trim();
  doc.setCreator('Fisioterapia'); doc.setProducer('Fisioterapia');
  const fR = await doc.embedFont(StandardFonts.Helvetica), fB = await doc.embedFont(StandardFonts.HelveticaBold);
  const permitidos = new Set(fR.getCharacterSet());
  const limpio = s => Array.from(String(s ?? '').replace(/[ \t]+/g, ' ')).map(c => permitidos.has(c.codePointAt(0)) ? c : '?').join('');
  doc.setTitle(limpio(`Plan de ejercicios en casa – ${nombreCompleto}`));
  const a = db.ajustes;
  const logo = await incrustarImagen(doc, a.clinicaLogo), firma = await incrustarImagen(doc, a.profFirma);
  const clinica = (a.clinicaNombre || '').trim(), prof = (a.profNombre || '').trim(), col = (a.profColegiado || '').trim();

  const W = 595.28, H = 841.89, M = 48;
  const tinta = rgb(0.078, 0.188, 0.169), gris = rgb(0.357, 0.435, 0.416), lineaC = rgb(0.827, 0.867, 0.847), fondo = rgb(0.925, 0.945, 0.935);
  let page, y, alNueva = null;
  const cabecera = () => {
    const lineasTxt = [];
    if (clinica) lineasTxt.push({ t: clinica, f: fB, s: 14, c: tinta });
    if (prof) lineasTxt.push({ t: `Profesional: ${prof}`, f: fR, s: 9.5, c: tinta });
    if (col) lineasTxt.push({ t: `Nº colegiado: ${col}`, f: fR, s: 9.5, c: tinta });
    if (!logo && !lineasTxt.length) return;
    let x = M, alto = 0;
    if (logo){
      const k = Math.min(150 / logo.width, 52 / logo.height, 1);
      const w = logo.width * k, h = logo.height * k;
      page.drawImage(logo, { x: M, y: y - h, width: w, height: h });
      x = M + w + 14; alto = h;
    }
    let yy = y - 2;
    for (const l of lineasTxt){ page.drawText(limpio(l.t), { x, y: yy - l.s, size: l.s, font: l.f, color: l.c }); yy -= l.s + 5; }
    alto = Math.max(alto, y - yy);
    y -= alto + 8;
    page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 0.8, color: lineaC }); y -= 14;
  };
  const nueva = () => { page = doc.addPage([W, H]); y = H - M; cabecera(); if (alNueva) alNueva(); };
  const hay = h => { if (y - h < M + 20) nueva(); };
  const texto = (t, x, size, font = fR, color = tinta) => page.drawText(limpio(t), { x, y: y - size, size, font, color });
  const envolver = (txt, font, size, ancho) => {
    const lineas = [];
    for (const parrafo of String(txt ?? '').split('\n')){
      let cur = '';
      for (let w of limpio(parrafo).split(' ')){
        while (font.widthOfTextAtSize(w, size) > ancho){
          let n = w.length; while (n > 1 && font.widthOfTextAtSize(w.slice(0, n), size) > ancho) n--;
          if (cur){ lineas.push(cur); cur = ''; }
          lineas.push(w.slice(0, n)); w = w.slice(n);
        }
        const prueba = cur ? cur + ' ' + w : w;
        if (!cur || font.widthOfTextAtSize(prueba, size) <= ancho) cur = prueba; else { lineas.push(cur); cur = w; }
      }
      lineas.push(cur);
    }
    return lineas.length ? lineas : [''];
  };
  const franja = t => {
    page.drawRectangle({ x: M, y: y - 18, width: W - 2 * M, height: 18, color: fondo });
    page.drawText(limpio(t), { x: M + 6, y: y - 13, size: 10, font: fB, color: tinta });
    y -= 26;
  };
  const ancho = W - 2 * M - 40;
  // Ejercicios de un día (o de «a elegir»), con su casilla para marcar, agrupados por bloque.
  const ejercicios = items => {
    let claveActual = null;
    for (const it of items){
      const k = it.grupo || '';
      if (k && k !== claveActual){
        const b = it.bloqueId ? db.bloques.find(x => x.id === it.bloqueId) : null;
        hay(34); texto(b ? (b.nivel ? `${b.nombre} · Nivel ${b.nivel}` : b.nombre) : 'Bloque', M + 4, 9.5, fB); y -= 15;
        if (it.notaGrupo) for (const l of envolver(it.notaGrupo, fR, 9, ancho + 14)){ hay(12); texto(l, M + 4, 9, fR, gris); y -= 12; }
      }
      claveActual = k;
      const bq = k && it.bloqueId ? db.bloques.find(x => x.id === it.bloqueId) : null;
      const nom = envolver(bq ? (nombreEnBloque(getE(it.exerciseId).nombre, bq) || 'Realizar el ejercicio') : getE(it.exerciseId).nombre, fR, 10, ancho);
      const nota = it.nota ? envolver(it.nota, fR, 9, ancho) : [];
      hay(nom.length * 13 + nota.length * 11.5 + 5);
      page.drawRectangle({ x: M + 6, y: y - 10, width: 9, height: 9, borderColor: gris, borderWidth: 0.9 });
      nom.forEach((l, i) => page.drawText(l, { x: M + 24, y: y - 9.5 - i * 13, size: 10, font: fR, color: tinta }));
      y -= nom.length * 13;
      nota.forEach((l, i) => page.drawText(l, { x: M + 24, y: y - 9 - i * 11.5, size: 9, font: fR, color: gris }));
      y -= nota.length * 11.5 + 5;
    }
  };

  nueva();
  texto('Plan de ejercicios en casa', M, 18, fB); y -= 26;
  texto(nombreCompleto, M, 12); y -= 18;
  for (const l of envolver(pl.nombre, fB, 11, W - 2 * M)){ texto(l, M, 11, fB); y -= 15; }
  texto(`Del ${fechaCortaPdf(pl.inicio)} al ${fechaCortaPdf(pl.fin)} (${textoDuracionDe(pl)})`, M, 10, fR, gris); y -= 22;
  if (pl.notas){
    hay(40); texto('Observaciones', M, 11, fB); y -= 16;
    for (const l of envolver(pl.notas, fR, 10, W - 2 * M)){ hay(14); texto(l, M, 10); y -= 13.5; }
    y -= 12;
  }
  const libres = delDia(0);
  if (libres.length){
    hay(60); franja('A elegir: cuando quieras durante el plan');
    alNueva = () => { texto('A elegir (continuación)', M, 9, fB, gris); y -= 18; };
    ejercicios(libres); y -= 10;
  }
  for (let d = primerDiaPlan(pl); d <= ultimoDiaPlan(pl); d++){
    const items = delDia(d);
    if (!items.length) continue;
    const f = fechaDiaPlan(pl, d);
    alNueva = null; hay(60);
    franja(fechaLargaPdf(f));
    alNueva = () => { texto(`${fechaLargaPdf(f)} (continuación)`, M, 9, fB, gris); y -= 18; };
    ejercicios(items);
    y -= 10;
  }
  alNueva = null;

  // Firma al final
  if (firma || prof || col){
    hay(110); y -= 10;
    let alto = 0;
    if (firma){
      const k = Math.min(170 / firma.width, 64 / firma.height, 1);
      alto = firma.height * k;
      page.drawImage(firma, { x: M, y: y - alto, width: firma.width * k, height: alto });
    } else alto = 40;
    y -= alto + 4;
    page.drawLine({ start: { x: M, y }, end: { x: M + 190, y }, thickness: 0.6, color: gris }); y -= 4;
    if (prof){ texto(prof, M, 9.5, fB); y -= 13; }
    if (col){ texto(`Nº colegiado: ${col}`, M, 9, fR, gris); y -= 13; }
  }
  const paginas = doc.getPages();
  paginas.forEach((pg, i) => pg.drawText(limpio(`${nombreCompleto} · Plan en casa · Página ${i + 1} de ${paginas.length}`), { x: M, y: 24, size: 8, font: fR, color: gris }));
  return doc.save();
}

/* ---------- ventanas propias de aviso, confirmación y texto (sustituyen a alert/confirm/prompt del navegador) ---------- */
// Devuelven una promesa: avisar → undefined; preguntar → true/false; pedirTexto → el texto o null si se cancela.
// Opciones: titulo, boton (texto del botón principal), cancelar (texto del otro botón), peligro (botón principal en rojo),
// palabra (hay que escribirla para poder confirmar) y valor (texto inicial de pedirTexto).
// Las pruebas automáticas pueden contestar ellas mismas definiendo window.__dialogoAuto(tipo, mensaje, valor, opciones).
const colaDialogos = [];
let dialogoActual = null, inertPrevio = null;
function dialogo(tipo, msg, op = {}){
  if (window.__dialogoAuto) return Promise.resolve(window.__dialogoAuto(tipo, String(msg ?? ''), op.valor ?? '', op));
  return new Promise(res => {
    colaDialogos.push({ tipo, msg: String(msg ?? ''), op, res });
    if (!dialogoActual) siguienteDialogo();
  });
}
const avisar = (msg, op) => dialogo('alert', msg, op);
const preguntar = (msg, op) => dialogo('confirm', msg, op);
const pedirTexto = (msg, valor, op) => dialogo('prompt', msg, { ...(op || {}), valor: valor ?? '' });
// elegir: varias respuestas posibles, como [['una', 'Solo esta'], ['todas', 'Esta y las siguientes']]. Devuelve el valor
// elegido o null si se cancela.
const elegir = (msg, opciones, op) => dialogo('choice', msg, { ...(op || {}), opciones, valor: opciones[0][0] });
function textoDialogoHTML(msg){
  return msg.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
}
function siguienteDialogo(){
  const d = colaDialogos.shift();
  dialogoActual = d || null;
  const cont = $('#dialogo');
  if (!d){
    cont.innerHTML = '';
    if (inertPrevio){ for (const [el, v] of inertPrevio) el.inert = v; inertPrevio = null; }
    return;
  }
  if (typeof cerrarAyudaCorta === 'function') cerrarAyudaCorta();
  if (!inertPrevio){
    inertPrevio = ['header', '#main', '#modal', '#avisoNovedades', '#deshacer'].map(s => document.querySelector(s)).filter(Boolean).map(el => [el, el.inert]);
    for (const [el] of inertPrevio) el.inert = true;
  }
  const { tipo, msg, op } = d;
  const principal = op.boton || 'Aceptar';
  const conCampo = tipo === 'prompt' || op.palabra;
  cont.innerHTML = `<div class="dlg-fondo"><div class="dlg" role="${tipo === 'alert' ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgTexto">
    ${op.titulo ? `<h3>${esc(op.titulo)}</h3>` : ''}
    <div id="dlgTexto">${textoDialogoHTML(msg)}</div>
    ${op.palabra ? `<label for="dlgCampo">Escribe <strong>${esc(op.palabra)}</strong> para confirmar</label>` : ''}
    ${conCampo ? `<input id="dlgCampo" autocomplete="off" value="${esc(op.palabra ? '' : op.valor)}" oninput="validarDialogo()">` : ''}
    <div class="row dlg-botones${op.vertical ? ' vertical' : ''}">
      ${tipo === 'alert' ? '' : `<button class="ghost" id="dlgNo" onclick="responderDialogo(false)">${esc(op.cancelar || 'Cancelar')}</button>`}
      ${tipo === 'choice' ? op.opciones.map(([v, t], i) => `<button class="${op.peligro ? 'btn rojo' : 'btn'}" ${i ? '' : 'id="dlgSi"'} data-valor="${esc(v)}" onclick="responderDialogo(true, this.dataset.valor)">${esc(t)}</button>`).join('')
        : `<button class="${op.peligro ? 'btn rojo' : 'btn'}" id="dlgSi" onclick="responderDialogo(true)">${esc(principal)}</button>`}
    </div></div></div>`;
  validarDialogo();
  setTimeout(() => {   // después del evento que abrió la ventana (un Intro no debe pulsar ya su botón)
    const f = conCampo ? $('#dlgCampo') : (op.peligro && $('#dlgNo')) || $('#dlgSi');
    if (f && dialogoActual === d){ f.focus(); if (f.select && !op.palabra) f.select(); }
  }, 30);
}
function validarDialogo(){
  const d = dialogoActual, b = $('#dlgSi'); if (!d || !b) return;
  if (d.op.palabra) b.disabled = norm($('#dlgCampo').value.trim()) !== norm(d.op.palabra);
}
function responderDialogo(si, valor){
  const d = dialogoActual; if (!d) return;
  if (si && $('#dlgSi') && $('#dlgSi').disabled) return;
  const v = d.tipo === 'alert' ? undefined : d.tipo === 'prompt' ? (si ? $('#dlgCampo').value : null) : d.tipo === 'choice' ? (si ? valor : null) : !!si;
  d.res(v);
  siguienteDialogo();
}
function cancelarDialogos(){
  while (dialogoActual) responderDialogo(false);
}
// Mientras hay una ventana abierta, el teclado es solo suyo: Esc cancela e Intro (en el campo de texto) acepta.
window.addEventListener('keydown', e => {
  if (!dialogoActual) return;
  if (e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); responderDialogo(dialogoActual.tipo === 'alert'); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'dlgCampo'){ e.preventDefault(); e.stopImmediatePropagation(); responderDialogo(true); return; }
  if (e.key === 'Tab'){
    const fs = [...document.querySelectorAll('#dialogo input, #dialogo button:not(:disabled)')];
    const i = fs.indexOf(document.activeElement);
    e.preventDefault(); e.stopImmediatePropagation();
    if (fs.length) fs[(i + (e.shiftKey ? -1 : 1) + fs.length) % fs.length].focus();
    return;
  }
  e.stopImmediatePropagation();   // que no lleguen a la app (puntuar con 0–3, Esc de otras ventanas…)
}, true);

/* ---------- deshacer ---------- */
// Antes de un cambio que borra algo se toma una «instantánea» de los datos; después se ofrece «Deshacer» unos segundos.
let instDeshacer = null, tDeshacer = null;
const instantanea = () => JSON.stringify(db);
function ofrecerDeshacer(antes, texto){
  if (!antes || antes === JSON.stringify(db)) return;
  instDeshacer = antes;
  let el = $('#deshacer');
  if (!el){ el = document.createElement('div'); el.id = 'deshacer'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(texto)}</span><button class="btn small" onclick="deshacer()">Deshacer</button><button class="ghost small" onclick="ocultarDeshacer()" aria-label="Ocultar este aviso" title="Ocultar">×</button>`;
  el.classList.add('visible');
  clearTimeout(tDeshacer); tDeshacer = setTimeout(ocultarDeshacer, 15000);
}
function ocultarDeshacer(){
  instDeshacer = null; clearTimeout(tDeshacer);
  const el = $('#deshacer'); if (el) el.classList.remove('visible');
}
function deshacer(){
  if (!instDeshacer) return;
  db = JSON.parse(instDeshacer);
  ocultarDeshacer();
  idxPunt = null; ui.selected.clear();
  render();
  if ($('#modal #tabsDia')) refrescarModalDia();
  const el = $('#guardado'); mostrarGuardado(); if (el) el.textContent = '✓ Deshecho';
}
// Cmd/Ctrl+Z deshace mientras se ve el aviso (fuera de los campos de texto, que tienen su propio deshacer).
document.addEventListener('keydown', e => {
  if (!instDeshacer || !(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z' || e.shiftKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
  e.preventDefault(); deshacer();
});

/* ---------- historial del navegador: «Atrás» y «Adelante» ---------- */
// Cada pantalla tiene su dirección (#/pacientes, #/paciente/<id>/calendario, #/plantilla/<id>…). Abrir una ventana
// añade un paso más, de modo que «Atrás» primero la cierra.
let navPrevia = '', aplicandoHistorial = false, modalEnHistorial = false, ignorarPop = false, navPendiente = false;
function estadoNav(){
  const v = ui.view;
  if (v === 'paciente') return `paciente/${ui.patientId}/${ui.tabP}${ui.tabP === 'calendario' && ui.calVista === 'resumen' ? '/resumen' : ui.tabP === 'casa' && ui.planCasaId ? '/' + ui.planCasaId : ''}`;
  if (v === 'plantilla') return `plantilla/${ui.plantillaId}`;
  return v;
}
function registrarNav(){
  const k = estadoNav();
  if (k === navPrevia) return;
  if (ignorarPop){ navPendiente = true; return; }   // se está deshaciendo el paso de una ventana: se anota después
  if (modalEnHistorial){ modalEnHistorial = false; history.replaceState(null, '', '#/' + k); }
  else if (!navPrevia || aplicandoHistorial) history.replaceState(null, '', '#/' + k);
  else history.pushState(null, '', '#/' + k);
  navPrevia = k;
}
function irANav(k){
  const [v, a, b, c] = (k || '').split('/');
  cerrarSubmenu();
  if (v === 'paciente' && getP(a)){
    if (ui.patientId !== a || ui.view !== 'paciente') prepararPaciente(a);
    ui.view = 'paciente'; ui.tabP = b || 'pautas'; ui.calVista = c === 'resumen' ? 'resumen' : 'calendario';
    ui.planCasaId = b === 'casa' && c && db.planes.some(x => x.id === c) ? c : null;
  } else if (v === 'plantilla' && db.plantillas.some(t => t.id === a)){ ui.plantillaId = a; ui.view = 'plantilla'; }
  else ui.view = ['pacientes', 'agenda', 'ejercicios', 'bloques', 'plantillas', 'ajustes', 'ayuda'].includes(v) ? v : 'pacientes';
  aplicandoHistorial = true; render(); aplicandoHistorial = false;
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => {
  if (ignorarPop){
    ignorarPop = false;
    if (navPendiente){ navPendiente = false; registrarNav(); }
    return;
  }
  cancelarDialogos();
  if (modalEnHistorial){ modalEnHistorial = false; $('#modal').innerHTML = ''; return; }   // «Atrás» con una ventana abierta: la cierra
  $('#modal').innerHTML = '';
  const k = location.hash.replace(/^#\/?/, '');
  navPrevia = k;
  irANav(k);
});


load().then(d => { db = d; loaded = true; postCarga(); const k = location.hash.replace(/^#\/?/, ''); if (k) irANav(k); else render(); avisoNovedades(); })
  .catch(() => avisar('No se puede conectar con la aplicación. Comprueba que la ventana de '+nombreVentana()+' sigue abierta.'));
</script>
