<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ejercicios de fisioterapia</title>
<style>
:root{--paper:#EEF2EF;--card:#FFFFFF;--field:#FFFFFF;--bar:#14302B;--ink:#14302B;--muted:#5B6F6A;--line:#D3DDD8;--accent:#2E6F5E;--danger:#A8432F;
--s0:#B5533C;--s1:#D89B3A;--s2:#8DB48E;--s3:#2E6F5E;--pend:#E3ECF6;--pend-line:#7A93B0;--zebra:#F4F7F5;--ses:#3F51B5;color-scheme:light}
:root[data-theme="dark"]{--paper:#0E1513;--card:#17211E;--field:#1E2B27;--bar:#0A0F0E;--ink:#E6EFEB;--muted:#9FB2AC;--line:#30403B;--accent:#3C8F78;--danger:#E58468;
--s0:#B5533C;--s1:#D89B3A;--s2:#8DB48E;--s3:#2E6F5E;--pend:#243241;--pend-line:#6F8AA9;--zebra:#1B2724;--ses:#8C9EFF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Iowan Old Style,Palatino,Georgia,serif;font-weight:600;margin:0 0 .5em}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--bar);color:#fff;flex-wrap:wrap;min-height:56px}
.marca{display:flex;align-items:center;gap:12px;font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:20px;font-weight:600;margin:0}
.marca img{height:36px;max-width:180px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
nav button{background:none;border:0;color:#cfe3dc;padding:6px 10px;cursor:pointer;font:inherit;border-radius:6px}
nav button.on{background:#ffffff22;color:#fff}
nav .nav-salir{margin-left:8px;border:1px solid #ffffff44}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.menu-sub{position:relative;display:inline-block}
.submenu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:170px;flex-direction:column;gap:2px;background:var(--bar);border-radius:10px;padding:6px;box-shadow:0 8px 24px #0004;z-index:20}
.menu-sub.abierto .submenu{display:flex}
.menu-claro .submenu{background:var(--card);border:1px solid var(--line);top:calc(100% + 4px)}
.menu-claro .submenu button{background:none;border:0;color:var(--ink);border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
.menu-claro .submenu button:hover:not(:disabled){background:var(--field);color:var(--accent)}
.menu-claro .submenu button:disabled{color:var(--muted);cursor:default}
.menu-claro .submenu button.peligro{color:var(--danger)}
.menu-fila{flex:none}
.menu-fila .submenu{left:auto;right:0;min-width:150px}
.submenu button{text-align:left;padding:8px 12px}
nav .submenu button:hover,nav > button:hover,nav .menu-sub > button:hover{background:#ffffff18;color:#fff}
main{max-width:1760px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
button.btn,button.ghost,button.danger{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--field);color:var(--ink);border-color:var(--line)}
button.danger{background:var(--field);color:var(--danger);border-color:var(--danger)}
button.quitar{color:var(--danger)}
button.quitar:hover:not(:disabled){border-color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button.small{padding:4px 9px;font-size:14px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field);width:100%;color:var(--ink)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.avatar.zoom{cursor:zoom-in}
#fotoAmpliada{position:fixed;inset:0;z-index:10000;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#fotoAmpliada figure{margin:0;text-align:center;color:#fff}
#fotoAmpliada img{max-width:min(92vw,900px);max-height:80vh;object-fit:contain;border-radius:10px;background:#fff}
#fotoAmpliada figcaption{margin-top:10px;font-size:16px}
.avatar.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:Georgia,serif}
.muted{color:var(--muted);font-size:14px}
.linea-ses{padding-left:18px;margin-top:2px}
.search{margin:12px 0 4px}
.orden-btn{all:unset;cursor:pointer;font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center;border-radius:4px}
.orden-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.orden-btn .flecha{font-size:10px;color:var(--muted);opacity:.55}
.orden-btn.on .flecha{opacity:1;color:var(--accent)}
.orden-btn:hover .flecha{opacity:1}
.cab-lista{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.cab-lista .cab-prim{flex:1;min-width:0}
.cab-lista .cab-col{text-align:right}
.paginacion{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0 2px;font-size:14px;color:var(--muted)}
.paginacion label{display:flex;gap:6px;align-items:center;margin:0}
.paginacion select{width:auto;padding:4px 6px}
.paginacion .pag-nav{display:flex;gap:8px;align-items:center}
#bloqueo{position:fixed;inset:0;z-index:9999;background:rgba(30,25,20,.55);display:flex;align-items:center;justify-content:center}
#bloqueo[hidden]{display:none}
.bloqueo-caja{background:var(--card,#fff);color:inherit;border-radius:12px;padding:28px 36px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.bloqueo-caja strong{font-size:18px}
.spinner{width:28px;height:28px;border:3px solid #ccc;border-top-color:#555;border-radius:50%;animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec.plain{border-top:0;padding:0}
.sec.plain > summary{margin-bottom:8px}
.bex{margin:6px 0 2px;padding-left:22px;font-size:14px;color:var(--ink)}
.bex li{margin:1px 0}
.sec summary{cursor:pointer;font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:18px;font-weight:600}
.sticky-head{position:sticky;top:var(--hh,60px);z-index:5;background:var(--paper);padding:12px 0 10px;margin-bottom:6px;box-shadow:0 8px 8px -8px #0003}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:13px;color:var(--muted);text-align:center;padding:4px}
.day{background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;cursor:pointer;font-size:14px;overflow:hidden;min-width:0}
.day.out{opacity:.4}
.day.today{border:2px solid var(--accent)}
.day .n{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--pend);border:1px dashed var(--pend-line);white-space:nowrap}
.chip{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 5px;border-radius:4px;margin-bottom:3px;background:var(--pend);border:1px dashed var(--pend-line)}
.chip .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ayuda-ico{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;margin-left:6px;border-radius:50%;border:1.5px solid var(--accent);background:var(--field);color:var(--accent);font:700 13px/1 system-ui,sans-serif;cursor:pointer;vertical-align:middle;flex:none}
.ayuda-ico:hover,.ayuda-ico:focus-visible{background:var(--accent);color:#fff}
#ayudaPop{position:fixed;z-index:10001;width:min(340px,calc(100vw - 24px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0004;padding:14px 16px;font-size:15px;line-height:1.45}
#ayudaPop h4{margin:0 26px 6px 0;font:600 16px/1.3 system-ui,sans-serif}
#ayudaPop p{margin:0 0 10px}
#ayudaPop .cerrar{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.ayuda-wrap{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.ayuda-toc{position:sticky;top:calc(var(--hh,60px) + 16px);max-height:calc(100vh - var(--hh,60px) - 40px);overflow:auto}
.ayuda-toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px}
.ayuda-toc a:hover{background:var(--field);color:var(--accent)}
.manual{max-width:820px;font-size:16px;line-height:1.6}
.manual h1{font-size:28px;margin:0 0 12px}
.manual h2{font-size:22px;margin:30px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.manual h1,.manual h2,.manual h3{scroll-margin-top:calc(var(--hh,60px) + 16px)}
.manual ul,.manual ol{padding-left:24px}
.manual li{margin:3px 0}
.manual a,#ayudaPop a{color:var(--accent);font-weight:600}
.manual .nota{border-left:4px solid var(--accent);background:var(--field);padding:8px 12px;border-radius:6px;margin:12px 0}
.manual .nota.importante{border-left-color:var(--danger)}
.manual section.oculto{display:none}
.manual mark{background:#f5d76e;color:#14302B;border-radius:3px}
@media (max-width:820px){.ayuda-wrap{grid-template-columns:1fr}.ayuda-toc{position:static;max-height:none}}
.chip .pun{font-weight:700;flex:none;min-width:1.2em;text-align:center}
tr.grp td{font-weight:700;padding-top:14px;border-bottom:1px solid var(--line)}
tr.en-grp td:first-child{padding-left:22px}
tr.rep-sub td{font-size:14px;color:var(--muted);padding-top:2px;padding-bottom:2px}
tr.rep-sub td:first-child{padding-left:28px}
.leyenda-lineas .ley{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.leyenda-lineas .ley:hover{border-color:var(--line)}
.leyenda-lineas .ley.oculta{opacity:.45;text-decoration:line-through}
.chip .nrep{flex:none;font-size:11px;opacity:.85}
.chip.s0{background:var(--s0);color:#fff;border:1px solid var(--s0)}
.chip.s1{background:var(--s1);color:#14302B;border:1px solid var(--s1)}
.chip.s2{background:var(--s2);color:#14302B;border:1px solid var(--s2)}
.chip.s3{background:var(--s3);color:#fff;border:1px solid var(--s3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.scores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scores button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--field);font:600 16px system-ui;cursor:pointer;color:var(--ink)}
.scores button.on.s0{background:var(--s0);border-color:var(--s0);color:#fff}
.scores button.on.s1{background:var(--s1);border-color:var(--s1);color:#14302B}
.scores button.on.s2{background:var(--s2);border-color:var(--s2);color:#14302B}
.scores button.on.s3{background:var(--s3);border-color:var(--s3);color:#fff}
.modal{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;padding:16px;z-index:10;overflow:hidden;overscroll-behavior:contain}
/* La ventana ocupa como mucho el alto disponible y solo se desplaza su contenido (.card). */
.modal .card{max-width:none;width:100%;flex:0 1 auto;min-height:0;max-height:none;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:var(--field);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.cal.semana .day{min-height:180px}
.day.mes{min-height:86px;display:flex;flex-direction:column;gap:4px}
.mes-media{align-self:flex-start;font-weight:700;font-size:18px;min-width:44px;text-align:center;padding:2px 8px;border-radius:8px}
.mes-media.s0{background:var(--s0);color:#fff}.mes-media.s1{background:var(--s1);color:#14302B}.mes-media.s2{background:var(--s2);color:#14302B}.mes-media.s3{background:var(--s3);color:#fff}
.mes-info{font-size:13px}
.mes-info.pend{color:var(--ink);font-weight:600}
.chip-grupo{font-size:11.5px;font-weight:700;color:var(--muted);margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.en-bloque{margin-left:6px}
.cal.semana .chip .nom{white-space:normal;line-height:1.25}
.chip.futuro{background:var(--field);border:1px solid var(--line)}
.mwrap{position:relative;width:100%;margin:auto;max-width:min(980px,96vw);display:flex;flex-direction:column;max-height:100%;min-height:0}
.mwrap.ancho{max-width:min(1500px,96vw)}
.gridf{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.lista-sel{max-height:min(48vh,440px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;column-width:320px;column-gap:28px}
.lista-sel > label,.lista-sel > .bItem{break-inside:avoid}
.lista-sel.vertical{columns:auto;column-count:auto;column-width:auto;max-height:min(52vh,520px);overflow-y:auto;overscroll-behavior:contain}
.lista-sel{overscroll-behavior:contain}
.asig-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:16px;align-items:start}
.asig-cols .asig-ej{min-width:0}
.ses-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;display:flex;flex-direction:column;min-width:0}
.ses-cab{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ses-todas,.ses-item{display:flex;gap:8px;align-items:flex-start;color:var(--ink);margin:0;padding:6px 0;cursor:pointer}
.ses-todas input,.ses-item input{width:auto;margin-top:3px;flex:none}
.ses-todas > span,.ses-item > span{display:flex;flex-direction:column;min-width:0}
.ses-todas .muted,.ses-item .muted{font-size:13px}
.ses-todas{border-bottom:1px solid var(--line);padding-bottom:8px}
.ses-lista{max-height:min(44vh,440px);overflow-y:auto;overscroll-behavior:contain}
.ses-lista .gTitulo{margin-top:8px}
.ses-item + .ses-item{border-top:1px solid var(--line)}
.ses-item input:disabled + .ses-punto + span{opacity:.75}
.ses-punto{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--accent));flex:none;margin-top:6px}
.ses-resumen{margin:8px 0 0;font-size:13px}
@media (max-width:800px){.asig-cols{grid-template-columns:1fr}}
body:has(#modal .modal){overflow:hidden}
.lista-sel.vertical > .bItem,.lista-sel.vertical > .exItem{padding:4px 0;margin:0 !important;border-bottom:1px solid var(--line)}
.lista-sel.vertical > .bItem > button{padding:2px 10px;font-size:13px}
.lista-sel.vertical .lista-bloque{margin:2px 0 4px 26px !important;columns:2 280px;column-gap:28px}
.lista-sel.vertical .lista-bloque li{break-inside:avoid}
#listaEjercicios,#listaBloques{column-width:520px;column-gap:36px}
#listaEjercicios > .item,#listaBloques > .item{break-inside:avoid}
#listaEjercicios > :not(.item),#listaBloques > :not(.item){column-span:all}
.dia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 28px}
p.muted{max-width:130ch}
.mwrap .card{max-width:none}
.modalx{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;padding:0}
.pac-main{min-width:0}
.ptabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px;border-bottom:2px solid var(--line)}
.ptabs .menu-sub > button{height:100%}
.ptabs .submenu{background:var(--card);border:1px solid var(--line);top:calc(100% + 2px)}
.ptabs .submenu button{border:0;margin:0;border-radius:6px;padding:8px 12px;color:var(--ink);font-weight:500;text-align:left}
.ptabs .submenu button:hover{background:var(--field);color:var(--accent)}
.ptabs .submenu button.on{color:var(--accent);font-weight:700}
.ptabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:0}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.titulo-sec{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:18px;font-weight:600}
.pautas-scroll{margin-top:8px}
.version{font-size:12px;color:#cfe3dc;opacity:.75;margin-left:10px;white-space:nowrap}
nav .nav-tema{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;margin-left:6px;border-radius:50%}
nav .nav-tema:hover{background:#ffffff22;color:#fff}
nav .nav-tema svg{width:18px;height:18px}
.sticky-head .det,.sticky-head .avatar,.sticky-head h2{transition:all .15s}
.sticky-head.compacta .det{display:none}
.sticky-head.compacta .avatar{width:36px!important;height:36px!important;font-size:13px}
.sticky-head.compacta h2{font-size:20px}
.sticky-head.compacta .card{padding-top:8px;padding-bottom:4px}
.lista-bloque{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.ej-dia{display:grid;grid-template-columns:minmax(160px,380px) auto auto;justify-content:start;column-gap:16px;align-items:start;padding:6px 0}
.ej-nom-dia{padding-top:9px;min-width:0}
.ej-reps{display:flex;flex-direction:column;gap:4px}
.ej-acc{display:flex;gap:6px;padding-top:6px}
.rep-fila{display:flex;align-items:center;gap:8px;border-radius:8px;padding:2px 4px}
.rep-fila.foco{outline:2px solid var(--accent);outline-offset:1px}
.rep-num{width:48px;font-size:13px}
.rep-x{width:28px}
.scores button{width:40px;height:40px}
@media(max-width:700px){.ej-dia{grid-template-columns:1fr}.ej-acc{padding-top:0}}
kbd{font:600 12px system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--field);color:var(--ink)}
.atajos{display:inline}
@media (hover:none){.atajos{display:none}}
#guardado{position:fixed;left:12px;bottom:10px;z-index:30;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
#guardado.visible{opacity:1}
#dialogo .dlg-fondo{position:fixed;inset:0;z-index:9000;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:22px 22px 16px;box-shadow:0 20px 50px #0005}
.dlg h3{margin:0 0 10px}
.dlg p{margin:0 0 10px;line-height:1.5;overflow-wrap:anywhere}
.dlg label{display:block;margin:6px 0 4px;color:var(--ink)}
.dlg-botones{justify-content:flex-end;margin-top:16px}
.dlg-botones.vertical{flex-direction:column;align-items:stretch}
.dlg-botones.vertical #dlgNo{order:9}

<script>
function nombreVentana() { return /Windows/i.test(navigator.userAgent) ? 'comandos (negra)' : 'Terminal'; }
document.querySelectorAll('.vtn').forEach(e => e.textContent = nombreVentana());

let db = normalize({});

let ui = { view: 'pacientes', patientId: null, tabP: 'pautas', planCasaId: null, fecha: new Date(), vista: 'mes', selDay: null, diaTab: 'puntuar', selected: new Set(), qP: '', qE: '', qB: '', qH: '', qEv: '', planActivo: {}, pag: {}, nivelB: '', res: { vista: 'mes', modo: 'lista', fecha: new Date(), desde: iso(firstOfMonth(new Date())), hasta: todayIso() } };

let assignIds = [];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fromIso(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); }
function todayIso(){ return iso(new Date()); }
function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function fmt(s){ return s ? fromIso(s).toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'}) : '—'; }
function fmtLong(s){ return fromIso(s).toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
const byName = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
// Sesiones (desde la 0.0.5): cada cita de un paciente es una sesión con sus propias puntuaciones; si ese día no

let saveChain = Promise.resolve();

function load(){
  return fetch('/api/state')
    .then(r => { revision = r.headers.get('X-Revision') || ''; return r.json(); })
    .then(normalize).then(d => { ultimoGuardado = plantillasMigradas || planesMigrados || seriesAmpliadas || sesionesMigradas ? null : JSON.stringify(d); return d; });

// Solo envía los datos al servidor si han cambiado: navegar por la app no reescribe la base de datos.
function save(){
  if (!loaded) return;
  limpiarLibres();

  if (body === ultimoGuardado) return;
  ultimoGuardado = body;
  saveChain = saveChain
    .then(() => fetch('/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Revision': revision }, body }))
    .then(r => {
      if (r.status === 409){
        // Otra ventana ha guardado datos más nuevos: se recarga para no pisarlos.
        avisar('Los datos se han modificado desde otra ventana de la aplicación.\n\nSe va a recargar esta ventana para no perder información. Los cambios que acabas de hacer aquí no se han guardado.')
          .then(() => location.reload());
        throw new Error('conflicto');
      }
      if (!r.ok) throw new Error();
      revision = r.headers.get('X-Revision') || revision;
      mostrarGuardado();
      trasGuardar();
    })
    .catch(e => {
      ultimoGuardado = null;   // se reintentará en el siguiente cambio
      if (!e || e.message !== 'conflicto') avisar('No se han podido guardar los cambios. Revisa la ventana de '+nombreVentana()+' donde está la aplicación.');
    });
}

/* ---------- paginación de las listas ---------- */
// Cada lista tiene su clave («pacientes», «hitos»…). Cuántos elementos se ven por página (10, 25, 50, 100 o todos) se
// guarda en los ajustes («pagina.<clave>»); la página en la que se está, solo en memoria (ui.pag). Con 10 elementos
// o menos no sale la botonera.
const POR_PAGINA = [10, 25, 50, 100];
function porPagina(clave){
  const v = db.ajustes['pagina.' + clave];

}
// Los elementos de la página actual y la botonera para cambiar de página. «repintar» es la llamada que vuelve a pintar

function paginar(clave, items, repintar = 'render()', firma = ''){
  const pp = porPagina(clave), total = items.length;
  firma += '|' + (db.ajustes['orden.' + clave] || '');   // al cambiar el orden se vuelve a la primera página
  const est = ui.pag[clave] || (ui.pag[clave] = { p: 1, firma });
  if (est.firma !== firma){ est.p = 1; est.firma = firma; }
  const paginas = pp ? Math.max(1, Math.ceil(total / pp)) : 1;
  est.p = Math.min(Math.max(1, est.p), paginas);

  const html = `<div class="paginacion" id="pag-${clave}">

      `<option value="${n || 'todos'}" ${n === pp ? 'selected' : ''}>${n || 'Todos'}</option>`).join('')}</select> por página</label>
    <span>${pp ? `${ini + 1}–${ini + vis.length} de ${total}` : `${total} en total`}</span>

      <span>Página ${est.p} de ${paginas}</span>

/* ---------- ordenar listas y tablas pulsando la cabecera de una columna ---------- */

// ascendente; otra vez, descendente; otra vez, se vuelve al orden por defecto. Se recuerda por lista en
// ajustes['orden.<clave>'] ('columna:asc'), como el tamaño de página.
const ORDEN_DEFECTO = {
  pacientes: ['nombre', 'asc'], ejercicios: ['nombre', 'asc'], bloques: ['nivel', 'asc'], plantillas: ['nombre', 'asc'],
  planes: ['inicio', 'desc'], hitos: ['fecha', 'desc'], evaluaciones: ['fecha', 'desc'], informes: ['generado', 'desc'],

function ordenDe(clave){
  const v = db.ajustes['orden.' + clave], d = ORDEN_DEFECTO[clave] || ['', 'asc'];

  const o = ordenDe(clave);

  const d = ORDEN_DEFECTO[clave] || [];

  setAjuste('orden.' + clave, !sig || (col === d[0] && sig === d[1]) ? '' : col + ':' + sig);

    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true, sensitivity: 'base' });

function irPagina(clave, d){ const est = ui.pag[clave]; if (est) est.p += d; }

// ---------- imágenes de la clínica (logo y firma) ----------
function imagenAPng(file, maxW, maxH){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if (!img.width || !img.height) return ko(new Error('imagen no válida'));
      let k = Math.min(1, maxW / img.width, maxH / img.height), out = '';
      for (let i = 0; i < 6; i++){   // si pesa demasiado, se reduce hasta que quepa
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/png');
        if (out.length < 450000) break;
        k *= 0.7;
      }
      ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('imagen no válida')); };
    img.src = url;
  });
}
async function subirImagen(clave, input, maxW, maxH, soloPng){
  const f = input.files[0]; input.value = '';
  if (!f) return;
  if (soloPng && !(f.type === 'image/png' || /\.png$/i.test(f.name))){ avisar('La firma debe ser un archivo PNG.'); return; }
  try { setAjuste(clave, await imagenAPng(f, maxW, maxH)); render(); }

}

// Días de la semana de una pauta: dígitos 1 (lunes) a 7 (domingo) en «dias»; vacío = todos los días.
const DIAS_SEMANA = [['1', 'L', 'Lunes'], ['2', 'M', 'Martes'], ['3', 'X', 'Miércoles'], ['4', 'J', 'Jueves'], ['5', 'V', 'Viernes'], ['6', 'S', 'Sábado'], ['7', 'D', 'Domingo']];
const digitoDia = s => String(((fromIso(s).getDay() + 6) % 7) + 1);   // «1» lunes … «7» domingo
const tocaDia = (p, day) => !p.dias || p.dias.includes(digitoDia(day));
function coveredBy(list, pid, day, eid, ses = ''){
  return list.some(p => p.patientId === pid && p.exerciseId === eid && p.desde <= day && (!p.hasta || day <= p.hasta) && tocaDia(p, day) && pautaEnSesion(p, ses));
}
// Pautas vigentes un día (en cualquiera de sus sesiones).
function activePautas(pid, day){
  return db.pautas.filter(p => p.patientId === pid && p.desde <= day && (!p.hasta || day <= p.hasta) && tocaDia(p, day));
}
// ¿Toca la pauta en esta sesión? pauta.sesion: '' = en todas (también sin cita); 's:<raíz>' = en las citas de esa
// serie (aunque se haya partido); 'c:<cita>' = solo en esa cita; '-' = sin sesión (solo en la sesión sin cita);
// '!c:<cita>,s:<raíz>…' = en todas menos esas (al dar una cita como «sesión vacía» en un día que ya tenía ejercicios).
const raizSerie = x => x.raiz || x.id;
function sesionEnToken(t, ses){
  if (t.startsWith('c:')) return t.slice(2) === ses;
  if (t.startsWith('s:')){ const c = getCita(ses), sr = c && c.serieId && getSerie(c.serieId); return !!sr && raizSerie(sr) === t.slice(2); }
  return false;
}
function pautaEnSesion(p, ses){
  const v = p.sesion || '';
  if (!v) return true;
  if (v === '-') return ses === '';
  if (v[0] === '!') return !ses || !v.slice(1).split(',').some(t => sesionEnToken(t, ses));
  if (!ses) return false;
  return sesionEnToken(v, ses);
}
// Añade una excepción («en todas menos…») a una pauta que tocaba en todas las sesiones.
function exceptuarSesion(p, token){
  const v = p.sesion || '';
  if (!v) p.sesion = '!' + token;
  else if (v[0] === '!' && !v.slice(1).split(',').includes(token)) p.sesion = v + ',' + token;
}
function ejerciciosDe(pautas){
  const seen = new Set(), out = [];
  for (const pa of pautas){
    if (seen.has(pa.exerciseId)) continue;
    seen.add(pa.exerciseId);
    const e = getE(pa.exerciseId);
    if (e) out.push({ pauta: pa, exercise: e });
  }
  return out.sort((a, b) => ((a.pauta.orden || 0) - (b.pauta.orden || 0)) || byName(a.exercise, b.exercise));
}
// Ejercicios de una sesión de un día, en orden de ejecución.
function exercisesSesion(pid, day, ses){ return ejerciciosDe(activePautas(pid, day).filter(p => pautaEnSesion(p, ses))); }
// Ejercicios del día, juntando todas sus sesiones (para resúmenes, calendario e informes).
function exercisesOn(pid, day){
  const ses = sesionesDia(pid, day);
  return ejerciciosDe(activePautas(pid, day).filter(p => ses.some(x => pautaEnSesion(p, x.id))));
}
// Sesiones de un paciente un día: una por cita (por hora) y la «sin cita» si no tiene citas ese día, si tiene
// puntuaciones sin cita o si tiene ejercicios sin sesión (que no tocan en ninguna de sus citas de ese día).
function sesionesDia(pid, day){
  const out = citasDia(pid, day).map(c => ({ id: c.id, cita: c }));
  if (!out.length || sesionesConPunt(pid, day).has('') || db.observaciones.some(o => o.patientId === pid && o.fecha === day && !o.sesion) || activePautas(pid, day).some(p => p.sesion && pautaEnSesion(p, '') && !out.some(x => pautaEnSesion(p, x.id)))) out.push({ id: '', cita: null });
  return out;
}
const etiquetaSesion = x => x.cita ? `Sesión ${x.cita.hora}–${finCita(x.cita)}` : 'Sin sesión';
// Cuántos ejercicios tocan un día (contando cada sesión) y cuántos están puntuados. «q» filtra por el buscador.
function cuentaDia(pid, day, q = ''){
  let total = 0, hechos = 0;
  for (const x of sesionesDia(pid, day)) for (const it of filtrarItemsQ(exercisesSesion(pid, day, x.id), q)){
    total++;
    if (puntuadoEn(pid, day, it.exercise.id, x.id)) hechos++;
  }
  return { total, hechos };
}
function filtrarItemsQ(items, q){
  if (!q || !q.trim()) return items;
  return items.filter(it => { const b = it.pauta.bloqueId ? db.bloques.find(x => x.id === it.pauta.bloqueId) : null; return coincideQ(q, it.exercise.nombre + ' ' + (b ? b.nombre : '')); });
}
// Puntuaciones de una cita que ya no está en ese día (anulada, movida o de otro paciente): pasan a la sesión sin
// cita de ese día, detrás de las que hubiera. Se hace antes de cada repintado, así ninguna puntuación se pierde.
function moverPuntSesion(pid, day, de, a){
  const pref = `${pid}|${day}|`, porEj = {};
  for (const k of Object.keys(db.puntuaciones)){
    if (!k.startsWith(pref)) continue;
    const x = partesClave(k);
    if (x.ses === de) (porEj[x.eid] = porEj[x.eid] || []).push({ k, ...x });
  }
  for (const [eid, xs] of Object.entries(porEj)){
    let base = 0;
    for (const k of Object.keys(db.puntuaciones)){ if (!k.startsWith(`${pref}${eid}|`)) continue; const x = partesClave(k); if (x.ses === a) base = Math.max(base, x.rep); }
    xs.sort((m, n) => m.rep - n.rep).forEach((x, i) => {
      const v = db.puntuaciones[x.k];
      delete db.puntuaciones[x.k];
      db.puntuaciones[scoreKey(pid, day, eid, base ? base + i + 1 : x.rep, a)] = v;
    });
  }
  idxPunt = null;
  moverObsSesion(pid, day, de, a);
}
function normalizarSesiones(){
  asegurarIndice();
  const mover = [];
  for (const [kd, st] of idxSesDia) for (const ses of st){
    if (!ses) continue;
    const c = getCita(ses), [pid, day] = kd.split('|');
    if (!c || c.fecha !== day || c.patientId !== pid) mover.push([pid, day, ses]);
  }
  for (const o of db.observaciones){   // una sesión con observaciones pero sin puntuaciones
    if (!o.sesion) continue;
    const c = getCita(o.sesion);
    if (!c || c.fecha !== o.fecha || c.patientId !== o.patientId) mover.push([o.patientId, o.fecha, o.sesion]);
  }
  mover.forEach(([pid, day, ses]) => moverPuntSesion(pid, day, ses, ''));
}
// Al pasar a la 0.0.5 con sesiones, las puntuaciones de un día que tiene una sola cita son de esa cita.
// Se hace una sola vez (ajustes.sesionesMigradas); después lo decide el usuario al dar cada cita.
let sesionesMigradas = false;
function migrarSesiones(d){
  if (d.ajustes.sesionesMigradas === '1') return;
  const unaCita = {}, cuenta = {};
  for (const c of d.citas){ const k = c.patientId + '|' + c.fecha; cuenta[k] = (cuenta[k] || 0) + 1; unaCita[k] = c.id; }
  const conSesion = new Set(Object.keys(d.puntuaciones).map(k => k.split('|')).filter(x => x.length === 5).map(x => x[0] + '|' + x[1]));
  for (const k of Object.keys(d.puntuaciones)){
    const x = k.split('|');
    if (x.length !== 4) continue;
    const kd = x[0] + '|' + x[1];
    if (cuenta[kd] !== 1 || conSesion.has(kd)) continue;   // un día que ya tiene sesiones no se toca
    const nueva = k + '|' + unaCita[kd];
    if (nueva in d.puntuaciones) continue;
    d.puntuaciones[nueva] = d.puntuaciones[k];
    delete d.puntuaciones[k];
    sesionesMigradas = true;   // hay que guardar ya; si no se ha movido nada, la marca se guarda con el próximo cambio
  }
  d.ajustes.sesionesMigradas = '1';
}

function resizePhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 240, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

// Elimina a uno o varios pacientes y todo lo suyo: pautas, puntuaciones, plan en casa, planes guardados, hitos y evaluaciones.
async function delPacientes(ids){
  const antes = instantanea();
  const ps = ids.map(getP).filter(Boolean); if (!ps.length) return;
  const set = new Set(ps.map(p => p.id));
  const claves = Object.keys(db.puntuaciones).filter(k => set.has(k.split('|')[0]));
  const n = {
    pautas: db.pautas.filter(x => set.has(x.patientId)).length,
    punt: claves.filter(k => db.puntuaciones[k] !== null && db.puntuaciones[k] !== undefined).length,
    planes: db.planes.filter(x => set.has(x.patientId)).length,
    hitos: db.hitos.filter(x => set.has(x.patientId)).length,
    eval: db.evaluaciones.filter(x => set.has(x.patientId)).length,
    citas: db.citas.filter(x => set.has(x.patientId) && x.fecha >= todayIso()).length
  };
  const partes = [[n.pautas, 'pautas'], [n.punt, 'puntuaciones'], [n.planes, 'planes en casa'], [n.hitos, 'hitos'], [n.eval, 'evaluaciones'], [n.citas, 'sesiones próximas']].filter(x => x[0]).map(x => `${x[0]} ${x[1]}`);
  const nombres = ps.slice(0, 8).map(p => `• ${p.apellidos}, ${p.nombre}`).join('\n') + (ps.length > 8 ? `\n• … y ${ps.length - 8} más` : '');
  const titulo = ps.length === 1 ? `¿Eliminar a ${ps[0].nombre} ${ps[0].apellidos}?` : `¿Eliminar a estos ${ps.length} pacientes?\n\n${nombres}`;
  if (!await preguntar(`${titulo}\n\n${partes.length ? 'Se borrarán también: ' + partes.join(', ') + '.' : (ps.length === 1 ? 'No tiene datos asociados.' : 'No tienen datos asociados.')}`, { boton: ps.length === 1 ? 'Eliminar paciente' : 'Eliminar ' + ps.length + ' pacientes', peligro: true })) return;
  db.patients = db.patients.filter(x => !set.has(x.id));
  db.pautas = db.pautas.filter(x => !set.has(x.patientId));
  db.planCasa = db.planCasa.filter(x => !set.has(x.patientId));
  db.hitos = db.hitos.filter(x => !set.has(x.patientId));
  db.evaluaciones = db.evaluaciones.filter(x => !set.has(x.patientId));
  db.planesGuardados = db.planesGuardados.filter(x => !set.has(x.patientId));
  db.planes = db.planes.filter(x => !set.has(x.patientId));
  db.citas = db.citas.filter(x => !set.has(x.patientId));
  db.seriesCitas = db.seriesCitas.filter(x => !set.has(x.patientId));
  db.informes = db.informes.filter(x => !set.has(x.patientId));   // los archivos PDF no se borran
  db.observaciones = db.observaciones.filter(x => !set.has(x.patientId));
  db.plantillas.forEach(t => { t.aplicaciones = (t.aplicaciones || []).filter(a => !set.has(a.patientId)); });
  claves.forEach(k => delete db.puntuaciones[k]);
  set.forEach(id => ui.selected.delete(id));
  if (set.has(ui.patientId)) ui.patientId = null;
  closeModal(); ui.view = 'pacientes'; render(); window.scrollTo(0, 0);
  ofrecerDeshacer(antes, ps.length === 1 ? `${ps[0].nombre} ${ps[0].apellidos} eliminado` : `${ps.length} pacientes eliminados`);
}

function celdaDia(p, s, max, out, etiqueta){

function filaEjercicioDia(p, s, exercise, bloque, ses = ''){

      </div>

// Los ejercicios se muestran en orden de ejecución, en una sola columna y agrupados bajo el nombre de su bloque.
function filasDia(p, s, q = '', ses = ''){
  contadorFilaDia = 0;
  const todos = exercisesSesion(p.id, s, ses), items = filtrarItemsQ(todos, q);
  if (!items.length) return `<p class="muted">${q.trim() && todos.length ? 'Ningún ejercicio de esta sesión coincide con la búsqueda.' : 'No hay ejercicios asignados para esta sesión.'}</p>`;
  const hayBloques = items.some(i => i.pauta.bloqueId);
  let html = '', actual = null;
  for (const { pauta, exercise } of items){
    const bid = pauta.bloqueId || '';
    if (actual === null || bid !== actual){
      if (actual !== null) html += '</div>';
      const b = bid ? db.bloques.find(x => x.id === bid) : null;
      const titulo = bid ? (b ? esc(b.nombre) + (b.nivel ? ` <span class="nivel">Nivel ${esc(b.nivel)}</span>` : '') : 'Bloque') : (hayBloques ? 'Ejercicios sueltos' : '');
      html += `<div class="grp-dia">${titulo ? `<div class="grp-titulo">${titulo}</div>` : ''}`;
      actual = bid;
    }
    html += filaEjercicioDia(p, s, exercise, bid ? db.bloques.find(x => x.id === bid) : null, ses);
  }
  return html + '</div>';
}

// Periodo que cubre el resumen según la botonera (día, semana, mes o intervalo).
function rangoResumen(){
  const r = ui.res, f = r.fecha;
  if (r.vista === 'dia') return [iso(f), iso(f)];
  if (r.vista === 'semana'){
    const a = inicioSemana(f);

  }
  if (r.vista === 'mes'){
    const a = firstOfMonth(f);
    return [iso(a), iso(new Date(a.getFullYear(), a.getMonth() + 1, 0))];
  }
  return [r.desde, r.hasta];
}
function tituloRango(desde, hasta){
  if (ui.res.vista === 'mes'){
    const s = fromIso(desde).toLocaleDateString('es-ES', {month:'long', year:'numeric'});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  return desde === hasta ? fmtLong(desde) : `${fmt(desde)} – ${fmt(hasta)}`;
}
function navegarResumen(dir){
  const f = ui.res.fecha, v = ui.res.vista;
  if (v === 'dia') ui.res.fecha = new Date(f.getFullYear(), f.getMonth(), f.getDate() + dir);
  else if (v === 'semana') ui.res.fecha = new Date(f.getFullYear(), f.getMonth(), f.getDate() + 7 * dir);

function fijarIntervalo(){
  const d = $('#resDesde').value, h = $('#resHasta').value;
  if (!d || !h || h < d){ avisar('La fecha "Hasta" debe ser igual o posterior a "Desde".'); return; }

// Recorre cada día del periodo y anota qué ejercicios estaban previstos y su puntuación.
function datosRango(p, desde, hasta){
  const dias = [];
  for (let d = fromIso(desde), fin = fromIso(hasta); d <= fin; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) dias.push(iso(d));
  const stats = {}, celdas = {}, porRep = {}, hoy = todayIso();
  for (const s of dias){
    if (s > hoy) continue;   // los días que aún no han llegado no cuentan como previstos ni pendientes
    // Cada ejercicio cuenta una vez al día; sus puntuaciones son las de todas las sesiones de ese día.
    for (const { pauta: pa } of exercisesOn(p.id, s)){
      const eid = pa.exerciseId;
      const st = stats[eid] || (stats[eid] = { exp: 0, scores: [], bloqueId: pa.bloqueId || '', orden: pa.orden || 0, reps: {}, minRep: Infinity, maxRep: 0 });
      st.exp++;
      const r = resumenDia(p.id, s, eid);
      r.vals.forEach(v => st.scores.push(v));
      if (r.avg !== null) st.puntuados = (st.puntuados || 0) + 1;
      (celdas[eid] || (celdas[eid] = {}))[s] = r.avg;
      // Repeticiones de ese día, sesión tras sesión (si no hay ninguna guardada, cuenta la Rep. 1 sin puntuar).
      const lista = repsDia(p.id, s, eid);
      const filas = lista.length ? lista : [{ rep: 1, valor: null }];
      (porRep[eid] || (porRep[eid] = {}))[s] = filas;
      st.minRep = Math.min(st.minRep, filas.length); st.maxRep = Math.max(st.maxRep, filas.length);
      filas.forEach((f, k) => {
        const rs = st.reps[k + 1] || (st.reps[k + 1] = { exp: 0, puntuados: 0, scores: [] });
        rs.exp++;
        if (f.valor !== null && f.valor !== undefined){ rs.puntuados++; rs.scores.push(f.valor); }
      });
    }
  }
  return { dias, stats, celdas, porRep };
}
// Deja solo los ejercicios que coinciden con el buscador (por nombre del ejercicio o de su bloque).
function filtrarDatos(datos, q){
  if (!q || !q.trim()) return datos;
  const ok = id => { const e = getE(id), b = datos.stats[id].bloqueId ? db.bloques.find(x => x.id === datos.stats[id].bloqueId) : null; return e && coincideQ(q, e.nombre + ' ' + (b ? b.nombre : '')); };
  const ids = Object.keys(datos.stats).filter(ok);
  const sub = o => Object.fromEntries(ids.filter(id => id in o).map(id => [id, o[id]]));
  return { dias: datos.dias, stats: sub(datos.stats), celdas: sub(datos.celdas), porRep: sub(datos.porRep) };
}
// «3 reps», «1 rep» o «1–3 reps» si cambia de un día a otro.
function textoReps(st){
  const a = st.minRep === Infinity ? 1 : st.minRep, b = st.maxRep || 1;
  return a === b ? `${b} rep${b === 1 ? '' : 's'}` : `${a}–${b} reps`;
}
const mediaDe = xs => xs.length ? (xs.reduce((a, b) => a + b, 0) / xs.length).toFixed(1) : '—';
// Ejercicios del resumen en orden de ejecución, agrupados por bloque (igual que la gráfica de puntos).
function idsOrdenResumen(datos){
  return Object.keys(datos.stats).filter(id => getE(id)).sort((a, b) => (datos.stats[a].orden - datos.stats[b].orden) || byName(getE(a), getE(b)));
}
function listadoResumen(datos){
  // Por defecto, en orden de ejecución. Al ordenar por una columna, los ejercicios siguen agrupados por bloque
  // (los bloques en su orden) y se ordenan dentro de cada uno.
  const base = idsOrdenResumen(datos), grupos = [...new Set(base.map(id => datos.stats[id].bloqueId || ''))];
  const media = st => st.scores && st.scores.length ? st.scores.reduce((a, b) => a + b, 0) / st.scores.length : null;
  const ids = ordenarLista('resumen', base, {
    nombre: id => getE(id).nombre, exp: id => datos.stats[id].exp, puntuados: id => datos.stats[id].puntuados || 0, media: id => media(datos.stats[id])
  }, (a, b) => base.indexOf(a) - base.indexOf(b)).sort((a, b) => grupos.indexOf(datos.stats[a].bloqueId || '') - grupos.indexOf(datos.stats[b].bloqueId || ''));
  if (!ids.length) return '<p class="muted">Sin ejercicios previstos en este periodo.</p>';
  const hayBloques = ids.some(id => datos.stats[id].bloqueId), hayReps = ids.some(id => datos.stats[id].maxRep > 1);
  let rows = '', actual = null;
  for (const id of ids){
    const e = getE(id), st = datos.stats[id], bid = st.bloqueId;
    const b = bid ? db.bloques.find(x => x.id === bid) : null;
    if (actual === null || bid !== actual){

  [g[i], g[j]] = [g[j], g[i]];
  const nuevo = new Map(); let n = 1;
  for (const [, xs] of g){
    const ids = [...new Set([...xs].sort((a, b) => (a.orden || 0) - (b.orden || 0)).map(p => p.exerciseId))];
    const rango = new Map(ids.map(id => [id, n++]));
    xs.forEach(p => nuevo.set(p.id, rango.get(p.exerciseId)));
  }
  const sc = document.querySelector('.pautas-scroll'), top = sc ? sc.scrollTop : 0;
  changePautas(list => list.map(p => nuevo.has(p.id) ? { ...p, orden: nuevo.get(p.id) } : p));
  const sc2 = document.querySelector('.pautas-scroll'); if (sc2) sc2.scrollTop = top;
}
// Quita la fecha de fin: la pauta pasa a ser continua (en cada ejercicio, el último tramo).
function hacerContinua(key){
  changePautas(list => {
    const max = {};
    list.filter(x => claveAsig(x) === key && x.hasta).forEach(x => { if (!max[x.exerciseId] || x.hasta > max[x.exerciseId]) max[x.exerciseId] = x.hasta; });
    return list.map(x => claveAsig(x) === key && x.hasta && x.hasta === max[x.exerciseId] ? { ...x, hasta: null } : x);
  });
}
// Periodo total de una pauta (todos sus tramos) y los días sueltos que se le han quitado («Quitar de este día»).
function periodoPauta(xs){
  const ini = xs.map(p => p.desde).sort()[0];
  const abierta = xs.some(p => !p.hasta);
  const fin = abierta ? null : xs.map(p => p.hasta).sort().pop();
  const huecos = new Set();
  const porEj = {};
  xs.forEach(p => (porEj[p.exerciseId] = porEj[p.exerciseId] || []).push(p));
  for (const tramos of Object.values(porEj)){
    tramos.sort((a, b) => a.desde.localeCompare(b.desde));
    for (let j = 1; j < tramos.length; j++){
      const prev = tramos.at(j - 1);
      if (!prev.hasta) continue;
      for (let d = addDays(prev.hasta, 1); d < tramos.at(j).desde && huecos.size < 400; d = addDays(d, 1)) huecos.add(d);
    }
  }
  return { ini, fin, abierta, huecos: [...huecos].sort() };
}
const pautaTerminada = xs => { const { fin } = periodoPauta(xs); return !!fin && fin < todayIso(); };
function textoPeriodo(per){

  const base = (per.ini > todayIso() ? 'Empieza el ' : 'Desde el ') + fmt(per.ini) + (per.fin ? ' hasta el ' + fmt(per.fin) : ' · continua');
  if (!per.huecos.length) return base;
  return base + ` · <span title="${esc(per.huecos.map(fmt).join(', '))}">sin ${per.huecos.length === 1 ? 'el ' + fmt(per.huecos.at(0)) : per.huecos.length + ' días sueltos'}</span>`;
}

async function guardarEditarPauta(k){
  const ini = $('#epIni').value, continua = $('#epTipo').value === 'continua', fin = $('#epFin').value;
  if (!ini){ avisar('Indica la fecha de inicio.'); return; }
  if (!continua && (!fin || fin < ini)){ avisar('La fecha de fin debe ser igual o posterior a la de inicio.'); return; }
  const dias = leerDiasPautaEditor();
  if (dias === false) return;
  const sesiones = leerSesionesPanel();
  const xs = db.pautas.filter(x => claveAsig(x) === k), primero = {}, ultimo = {};
  const finDe = x => x.hasta || '9999-12-31';
  xs.forEach(x => {
    const c = primero[x.exerciseId]; if (!c || x.desde < c.desde) primero[x.exerciseId] = x;
    const u = ultimo[x.exerciseId]; if (!u || finDe(x) > finDe(u)) ultimo[x.exerciseId] = x;
  });
  const ids1 = new Set(Object.values(primero).map(x => x.id)), ids2 = new Set(Object.values(ultimo).map(x => x.id));
  if (xs.some(x => ids1.has(x.id) && !ids2.has(x.id) && x.hasta && ini > x.hasta)){ avisar('La fecha de inicio no puede ser posterior a un tramo que ya termina antes.'); return; }
  closeModal();
  const ponSesion = (y, v) => { if (v) y.sesion = v; else delete y.sesion; return y; };
  changePautas(list => {
    const out = [];
    for (const x of list){
      if (claveAsig(x) !== k){ out.push(x); continue; }
      let y = { ...x };
      if (ids1.has(x.id)) y.desde = ini;
      if (ids2.has(x.id)) y.hasta = continua ? null : fin;
      if (dias !== null) y.dias = dias;
      if (sesiones) ponSesion(y, sesiones[0]);
      out.push(y);
    }
    // Más de una sesión marcada: la pauta se repite para cada una (cada copia, su propio grupo).
    if (sesiones) sesiones.slice(1).forEach(v => {
      const g = uid();
      out.filter(y => claveAsig(y) === k && (y.sesion || '') === sesiones[0]).forEach(y => out.push(ponSesion({ ...y, id: uid(), asignacion: g }, v)));
    });
    return out.filter(x => !x.hasta || x.hasta >= x.desde);
  });
}

function quitarDeDia(eid, ses){ quitarEjerciciosDeDia(new Set([eid]), null, ses); }
// Quita todos los ejercicios (bloques y sueltos) de la sesión abierta; el resto de días y sesiones no cambia.
function quitarTodosDeDia(){
  const ses = sesionActual();
  const ids = new Set(exercisesSesion(ui.patientId, ui.selDay, ses).map(i => i.exercise.id));
  if (!ids.size) return;
  const varias = sesionesDia(ui.patientId, ui.selDay).length > 1;
  quitarEjerciciosDeDia(ids, `¿Quitar los ${ids.size} ejercicios del ${fmtLong(ui.selDay)}${varias ? ` (${etiquetaSesion(sesionesDia(ui.patientId, ui.selDay).find(x => x.id === ses)).toLowerCase()})` : ''}?\n\nSolo se quitan de ${varias ? 'esta sesión de ' : ''}ese día; en el resto ${varias ? 'siguen' : 'de días siguen'} asignados.`, ses);
}
// La pauta se parte alrededor del día; ese día sigue valiendo para las demás sesiones en que tocaba
// (se añade una pauta de ese día solo para cada una de ellas).
async function quitarEjerciciosDeDia(eids, confirmar, ses){
  const pid = ui.patientId, day = ui.selDay;
  if (ses === undefined || ses === null) ses = sesionActual();
  const otras = sesionesDia(pid, day).map(x => x.id).filter(x => x !== ses);
  const ok = await changePautas(list => {
    const out = [];
    for (const p of list){
      const eid = p.exerciseId;
      const cubre = p.patientId === pid && eids.has(eid) && p.desde <= day && (!p.hasta || day <= p.hasta) && tocaDia(p, day) && pautaEnSesion(p, ses);
      if (!cubre){ out.push(p); continue; }
      const comun = { patientId: pid, exerciseId: eid, asignacion: claveAsig(p), bloqueId: p.bloqueId || '', orden: p.orden || 0 };
      if (p.desde < day) out.push({ ...p, asignacion: claveAsig(p), hasta: addDays(day, -1) });
      if (!p.hasta || day < p.hasta) out.push({ id: uid(), ...comun, desde: addDays(day, 1), hasta: p.hasta, ...(p.dias ? { dias: p.dias } : {}), ...(p.sesion ? { sesion: p.sesion } : {}) });
      for (const o of otras) if (pautaEnSesion(p, o)) out.push({ id: uid(), ...comun, desde: day, hasta: day, sesion: o ? 'c:' + o : '-' });
    }
    return out;
  }, confirmar, eids.size === 1 ? 'Ejercicio quitado de este día' : 'Ejercicios quitados de este día');
  if (ok) refrescarModalDia();
}

/* ---------- día: puntuar y añadir ---------- */
// Ventana de un día: pestañas «Puntuar ejercicios» (por defecto) y «Añadir ejercicios» (si el día está vacío, se abre en esta).
// «ses»: la sesión que se abre (id de una cita o '' sin cita); si no se indica, la que toca (ver sesionPorDefecto).
function openDay(s, tab, ses){

  ui.selSes = ses !== undefined && sesionesDia(ui.patientId, s).some(x => x.id === ses) ? ses : sesionPorDefecto(ui.patientId, s);
  ui.diaTab = tab || (exercisesSesion(ui.patientId, s, ui.selSes).length ? 'puntuar' : 'anadir');

// Hoy, la cita que está en curso o la siguiente; otro día, la primera sesión con algo sin puntuar.
function sesionPorDefecto(pid, day){
  const ses = sesionesDia(pid, day);
  if (day === todayIso()){
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const c = ses.find(x => x.cita && minDe(x.cita.hora) + x.cita.duracion >= m);
    if (c) return c.id;
  }
  const pend = ses.find(x => exercisesSesion(pid, day, x.id).some(it => !puntuadoEn(pid, day, it.exercise.id, x.id)));
  return (pend || ses[0]).id;
}
function sesionActual(){
  const ses = sesionesDia(ui.patientId, ui.selDay);

// Fila de puntuación activa para el teclado (la primera sin puntuar al abrir el día).
function marcarFocoDia(){
  const filas = [...document.querySelectorAll('#modal #secPun .rep-fila')];
  if (!filas.length) return;
  if (ui.diaFoco === undefined || ui.diaFoco === null || ui.diaFoco >= filas.length){
    const i = filas.findIndex(f => !f.querySelector('.scores button.on'));
    ui.diaFoco = i < 0 ? 0 : i;
  }
  filas.forEach((f, i) => f.classList.toggle('foco', i === ui.diaFoco));
}
document.addEventListener('keydown', e => {
  if (!document.querySelector('#modal #secPun .rep-fila') || $('#ayudaPop') || $('#fotoAmpliada')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
  const filas = [...document.querySelectorAll('#modal #secPun .rep-fila')];
  const i = Math.min(Math.max(ui.diaFoco || 0, 0), filas.length - 1), f = filas.at(i);
  if (/^[0-3]$/.test(e.key)){
    e.preventDefault();
    const n = Number(e.key);
    db.puntuaciones[scoreKey(ui.patientId, ui.selDay, f.dataset.eid, Number(f.dataset.rep), f.dataset.ses || '')] = n;
    idxPunt = null; ui.diaFoco = Math.min(i + 1, filas.length - 1);
    render(); refrescarModalDia(); seguirFocoDia();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    ui.diaFoco = Math.min(Math.max(i + (e.key === 'ArrowDown' ? 1 : -1), 0), filas.length - 1);
    marcarFocoDia(); seguirFocoDia();
  } else if (e.key === '+'){
    e.preventDefault();
    addRep(ui.patientId, ui.selDay, f.dataset.eid, f.dataset.ses || '');
  }
});

function setScore(pid, day, eid, rep, n, ses = ''){
  const k = scoreKey(pid, day, eid, rep, ses);

// Añade una fila de repetición sin puntuar al ejercicio de ese día.
function addRep(pid, day, eid, ses = ''){
  const reps = repsDe(pid, day, eid, ses);
  // Sin repeticiones guardadas se ve la Rep. 1 «virtual»: se guarda también (vacía) para que aparezca de verdad una fila nueva.
  if (!reps.length) db.puntuaciones[scoreKey(pid, day, eid, 1, ses)] = null;
  const siguiente = reps.length ? reps[reps.length - 1].rep + 1 : 2;
  db.puntuaciones[scoreKey(pid, day, eid, siguiente, ses)] = null;
  idxPunt = null;
  render(); refrescarModalDia();
  // La repetición nueva queda marcada para puntuarla con el teclado.
  const filas = [...document.querySelectorAll('#modal #secPun .rep-fila')];
  const i = filas.findIndex(f => f.dataset.eid === eid && Number(f.dataset.rep) === siguiente && (f.dataset.ses || '') === ses);
  if (i >= 0){ ui.diaFoco = i; marcarFocoDia(); }
}
function quitarRep(pid, day, eid, rep, ses = ''){
  delete db.puntuaciones[scoreKey(pid, day, eid, rep, ses)];
  idxPunt = null;

}

      <button class="ghost small" onclick="marcarVisibles(true)">Marcar visibles</button>

// Solo oculta las filas: las casillas marcadas siguen marcadas aunque no se vean.
function filtrarEjercicios(v){
  const q = norm(v).split(/\s+/).filter(Boolean);
  const nv = $('#aNivel') ? $('#aNivel').value : '';
  let visibles = 0;
  document.querySelectorAll('.exItem, .bItem').forEach(el => {
    let ok = q.every(x => el.dataset.n.includes(x));
    if (ok && nv === '__ej') ok = el.classList.contains('exItem');
    else if (ok && nv !== ''){
      ok = el.classList.contains('bItem') && (nv === '__sin' ? !el.dataset.nivel : el.dataset.nivel === nv);
    }
    el.style.display = ok ? 'flex' : 'none';
    if (ok) visibles++;
  });
  // Un título de grupo solo se ve si queda alguna fila de su grupo.
  document.querySelectorAll('.gTitulo').forEach(t => {
    const g = t.dataset.g;
    const hay = [...document.querySelectorAll(g === '__ej' ? '.exItem' : '.bItem')].some(el => el.style.display !== 'none' && (g === '__ej' || el.dataset.g === g));
    t.style.display = hay ? 'block' : 'none';
  });
  $('#sinEjAsignar').style.display = visibles ? 'none' : 'block';
}
// Marca o desmarca solo las filas visibles (las que no están ocultas por la búsqueda).
function marcarVisibles(valor){
  document.querySelectorAll('.exItem, .bItem').forEach(el => {
    if (el.style.display === 'none') return;
    el.querySelector('input[type="checkbox"]').checked = valor;
  });
  sincronizarOrden();
}
// Un bloque se asigna como un grupo: cada ejercicio es una pauta, y todas comparten la misma clave de asignación.
// Un ejercicio suelto también es un grupo de una sola pauta. «omitir»: ejercicios que no se añaden.
function leerSeleccionModal(){
  return {
    bloqueIds: [...document.querySelectorAll('#modal .bCheck:checked')].map(c => c.value),
    exIds: [...document.querySelectorAll('#modal .exCheck:checked')].map(c => c.value)
  };
}
// «sesion»: en qué sesiones toca (ver pautaEnSesion); '' = en todas.
function crearPautas(pids, bloqueIds, exIds, desde, hasta, omitir = new Set(), dias = '', sesion = ''){
  const yaExiste = (pid, eid) => db.pautas.some(p => p.patientId === pid && p.exerciseId === eid && p.desde === desde && p.hasta === hasta && (p.sesion || '') === sesion);
  const extra = { ...(dias ? { dias } : {}), ...(sesion ? { sesion } : {}) };
  const hechos = new Set();
  for (const pid of pids){
    // Primero los bloques; así, si un ejercicio también va suelto, no se duplica.
    for (const bid of bloqueIds){
      const b = db.bloques.find(x => x.id === bid);
      if (!b) continue;
      const asignacion = uid();
      const base = siguienteOrden();
      b.ejercicios.forEach((eid, idx) => {
        if (!getE(eid) || omitir.has(eid) || yaExiste(pid, eid)) return;
        db.pautas.push({ id: uid(), patientId: pid, exerciseId: eid, desde, hasta, asignacion, bloqueId: bid, orden: base + idx, ...extra });
        hechos.add(eid);
      });
    }
    for (const eid of exIds){
      if (omitir.has(eid) || hechos.has(eid) || yaExiste(pid, eid)) continue;
      db.pautas.push({ id: uid(), patientId: pid, exerciseId: eid, desde, hasta, asignacion: uid(), bloqueId: '', orden: siguienteOrden(), ...extra });
    }
  }
}
function saveAssign(){
  const { bloqueIds, exIds } = leerSeleccionModal();
  if (!bloqueIds.length && !exIds.length){ avisar('Selecciona al menos un bloque o un ejercicio.'); return; }
  const desde = $('#aDesde').value || todayIso();
  const tipo = $('#aTipo').value;
  let hasta = null;
  if (tipo === 'dia') hasta = desde;
  if (tipo === 'rango'){
    hasta = $('#aHasta').value;
    if (!hasta || hasta < desde){ avisar('La fecha "Hasta" debe ser igual o posterior a "Desde".'); return; }
  }
  const dias = tipo === 'dia' ? '' : leerDias('aDias');
  if (dias === null){ avisar('Marca al menos un día de la semana.'); return; }
  (leerSesionesPanel() || ['']).forEach(v => crearPautas(assignIds, bloqueIds, exIds, desde, hasta, new Set(), dias, v));
  ui.selected.clear();
  closeModal(); render();
}
// Añade bloques o ejercicios solo al día abierto en la ventana de puntuación.
function addDayEx(){
  const { bloqueIds, exIds } = leerSeleccionModal();

  const sesion = ses ? 'c:' + ses : (citasDia(ui.patientId, dia).length ? '-' : '');
  crearPautas([ui.patientId], bloqueIds, exIds, dia, dia, new Set(exercisesSesion(ui.patientId, dia, ses).map(i => i.exercise.id)), '', sesion);
  ui.diaTab = 'puntuar';   // tras añadir, se pasa a puntuar lo que se acaba de añadir
  render(); renderDayModal();
}

// Formato propio: { formato: 'fisioterapia-maestros', version: 1, ejercicios: [{id, nombre}], bloques: [{id, nombre, nivel, ejercicios: [ids]}] }.

// Lo que se va a exportar: los bloques marcados llevan siempre sus ejercicios, aunque no se marque «Ejercicios».
function datosExpMaestros(conBl, conEj){
  const bloques = conBl ? db.bloques.map(b => ({ id: b.id, nombre: b.nombre, nivel: b.nivel || '', ejercicios: b.ejercicios.filter(id => getE(id)) })).filter(b => b.ejercicios.length) : [];

async function exportarMaestros(){

  } catch (e){

// Convierte un archivo importado en { ejercicios: [{id, nombre}], bloques: [{id, nombre, nivel, ejercicios: [ids]}], soloDeBloques }.
// Devuelve null si no es un archivo de la aplicación.
function interpretarImport(j){
  if (!j || typeof j !== 'object') return null;
  const texto = v => typeof v === 'string' ? v.trim() : '';
  const nivelDe = b => texto(b.nivel).slice(0, 20);
  if (j.formato === 'fisioterapia-maestros' && (Array.isArray(j.ejercicios) || Array.isArray(j.bloques))){
    const ejercicios = [], porId = new Set();
    (Array.isArray(j.ejercicios) ? j.ejercicios : []).forEach(e => {
      if (!e || e.id == null || !texto(e.nombre) || porId.has(String(e.id))) return;
      porId.add(String(e.id)); ejercicios.push({ id: String(e.id), nombre: texto(e.nombre).slice(0, 300) });
    });
    const bloques = (Array.isArray(j.bloques) ? j.bloques : [])
      .filter(b => b && b.id != null && texto(b.nombre) && Array.isArray(b.ejercicios))
      .map(b => ({ id: String(b.id), nombre: texto(b.nombre).slice(0, 300), nivel: nivelDe(b), ejercicios: [...new Set(b.ejercicios.map(String).filter(id => porId.has(id)))] }))
      .filter(b => b.ejercicios.length);
    return { ejercicios, bloques, soloDeBloques: false, exportado: texto(j.exportado), clinica: texto(j.clinica) };
  }
  if (j.formato === 'fisioterapia-bloques' && Array.isArray(j.bloques)){
    // Catálogo: los ejercicios van por nombre dentro de cada bloque y se identifican como «<bloque>-<n>».
    const ejercicios = [], bloques = [];
    j.bloques.forEach(b => {
      if (!b || b.id == null || !texto(b.nombre) || !Array.isArray(b.ejercicios)) return;
      const ids = b.ejercicios.filter(x => texto(x)).map((nombre, i) => { const id = `${b.id}-${i + 1}`; ejercicios.push({ id, nombre: texto(nombre) }); return id; });
      if (ids.length) bloques.push({ id: String(b.id), nombre: texto(b.nombre), nivel: nivelDe(b), ejercicios: ids });
    });
    return { ejercicios, bloques, soloDeBloques: true, exportado: '', clinica: texto(j.origen) };
  }
  return null;
}
// Decide qué se añade al combinar el archivo con la biblioteca actual. Nada de lo que ya existe se cambia:
//  - un bloque ya existe si tiene el mismo identificador, o el mismo nombre y nivel;
//  - un ejercicio ya existe si tiene el mismo identificador o el mismo nombre (sin distinguir mayúsculas ni tildes):
//    los bloques nuevos usan entonces el ejercicio que ya hay.
function planImport(d){
  const bIds = new Set(db.bloques.map(b => b.id)), bNom = new Set(db.bloques.map(b => norm(b.nombre) + '|' + norm(b.nivel || '')));
  const bloquesNuevos = [];
  let bloquesExisten = 0;
  d.bloques.forEach(b => {
    const k = norm(b.nombre) + '|' + norm(b.nivel);
    if (bIds.has(b.id) || bNom.has(k)){ bloquesExisten++; return; }
    bIds.add(b.id); bNom.add(k); bloquesNuevos.push(b);
  });
  // De un catálogo solo se traen los ejercicios de los bloques que se van a añadir.
  const usados = new Set(bloquesNuevos.flatMap(b => b.ejercicios));
  const ejs = d.soloDeBloques ? d.ejercicios.filter(e => usados.has(e.id)) : d.ejercicios;
  const porId = new Map(db.exercises.map(e => [e.id, e]));
  const porNombre = new Map(biblioteca().map(e => [norm(e.nombre.trim()), e]));
  const mapa = new Map(), ejerciciosNuevos = [];
  let ejerciciosExisten = 0;
  ejs.forEach(e => {
    const mismoId = porId.get(e.id);
    const ya = (mismoId && !mismoId.libre ? mismoId : null) || porNombre.get(norm(e.nombre));
    if (ya){ mapa.set(e.id, ya.id); ejerciciosExisten++; return; }
    const x = { id: porId.has(e.id) ? uid() : e.id, nombre: e.nombre };
    porId.set(x.id, x); porNombre.set(norm(x.nombre), x); mapa.set(e.id, x.id); ejerciciosNuevos.push(x);
  });
  const bloques = bloquesNuevos.map(b => ({ id: b.id, nombre: b.nombre, nivel: b.nivel, ejercicios: [...new Set(b.ejercicios.map(id => mapa.get(id)).filter(Boolean))] })).filter(b => b.ejercicios.length);
  return { ejerciciosNuevos, ejerciciosExisten, bloques, bloquesExisten: bloquesExisten + bloquesNuevos.length - bloques.length };
}
let pendingImport = null;
// Lee un archivo de ejercicios y bloques y muestra un resumen antes de importar (los dos botones «Importar…» usan esto).
function leerImportBloques(input){
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let j = null;
    try { j = JSON.parse(reader.result); } catch(e) { j = null; }
    const d = interpretarImport(j);
    if (!d){
      avisar('El archivo no es de ejercicios y bloques de la aplicación.\n\nSe pueden importar los archivos creados con «Exportar…» y los catálogos de bloques, como bloques_dmi.json.');
      return;
    }
    const pl = planImport(d);
    pendingImport = pl;
    const nEjAhora = biblioteca().length, nBlAhora = db.bloques.length;
    const porNivel = {};
    pl.bloques.forEach(b => { const k = b.nivel ? 'Nivel ' + b.nivel : 'Sin nivel'; porNivel[k] = (porNivel[k] || 0) + 1; });
    const desglose = Object.keys(porNivel).sort().map(k => `${esc(k)}: ${porNivel[k]}`).join(' · ');
    const nada = !pl.bloques.length && !pl.ejerciciosNuevos.length;
    const origen = [d.clinica, d.exportado ? 'exportado el ' + fmt(d.exportado) : ''].filter(Boolean).join(', ');
    showModal(`
      <h3>Importar ejercicios y bloques${ayudaIco('maestros')}</h3>
      <p class="muted">Archivo: <strong>${esc(f.name)}</strong>${origen ? ' (' + esc(origen) + ')' : ''}</p>
      ${nEjAhora || nBlAhora ? `<div class="aviso-import" role="alert"><strong>Esta base de datos ya tiene ${[nEjAhora ? plural(nEjAhora, 'ejercicio', 'ejercicios') : '', nBlAhora ? plural(nBlAhora, 'bloque', 'bloques') : ''].filter(Boolean).join(' y ')}.</strong>
        Lo que importes se combinará con lo que ya hay: no se borra ni se cambia nada, y lo que ya existe (con el mismo nombre) no se duplica.</div>` : ''}
      <ul class="lista-import">
        <li>Bloques: <strong>${pl.bloques.length}</strong> ${pl.bloques.length === 1 ? 'nuevo' : 'nuevos'}${pl.bloquesExisten ? ` · ${pl.bloquesExisten} ya ${pl.bloquesExisten === 1 ? 'existe' : 'existen'}` : ''}${desglose ? `<div class="muted">${desglose}</div>` : ''}</li>
        <li>Ejercicios: <strong>${pl.ejerciciosNuevos.length}</strong> ${pl.ejerciciosNuevos.length === 1 ? 'nuevo' : 'nuevos'}${pl.ejerciciosExisten ? ` · ${pl.ejerciciosExisten} ya ${pl.ejerciciosExisten === 1 ? 'existe' : 'existen'}` : ''}</li>
      </ul>
      ${nada ? '<p class="muted">No hay nada nuevo que importar: todo lo del archivo ya está en la aplicación.</p>' : ''}
      <p class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn" onclick="aplicarImportBloques()" ${nada ? 'disabled' : ''}>${nEjAhora || nBlAhora ? 'Combinar e importar' : 'Importar'}</button>
      </p>`);
  };
  reader.readAsText(f);
}
function aplicarImportBloques(){
  const pl = pendingImport; if (!pl) return;
  const antes = instantanea();
  pendingImport = null;
  db.exercises.push(...pl.ejerciciosNuevos.map(e => ({ id: e.id, nombre: e.nombre })));
  db.bloques.push(...pl.bloques);
  closeModal(); render();
  ofrecerDeshacer(antes, `Importados ${plural(pl.bloques.length, 'bloque', 'bloques')} y ${plural(pl.ejerciciosNuevos.length, 'ejercicio', 'ejercicios')}`);
}
async function delBloque(id){
  const antes = instantanea();
  const b = db.bloques.find(x => x.id === id);
  if (!await preguntar(`¿Eliminar el bloque "${b.nombre}"? Los ejercicios no se borran. Las pautas ya asignadas con este bloque se mantienen.`, { boton: 'Eliminar', peligro: true })) return;
  db.bloques = db.bloques.filter(x => x.id !== id);
  db.pautas.forEach(p => { if (p.bloqueId === id) p.bloqueId = ''; });

/* ---------- agenda: citas ---------- */
// Cada cita es un día y una hora para un paciente. Las que se repiten cada semana pertenecen a una serie
// (db.seriesCitas): la serie crea sus citas una a una (las que no tienen fecha de fin, para los próximos 6 meses, y
// se van ampliando solas). Cada cita de una serie recuerda el día que le tocaba (fechaSerie), de modo que se puede
// mover o anular una sola sin que la serie la vuelva a crear.
const minDe = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const horaDe = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const finCita = c => horaDe(Math.min(minDe(c.hora) + (c.duracion || 45), 24 * 60));
const getCita = id => db.citas.find(c => c.id === id);
const getSerie = id => db.seriesCitas.find(s => s.id === id);
const citasDe = pid => db.citas.filter(c => c.patientId === pid);
const ordenCita = (a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora);
const DURACIONES_CITA = [15, 20, 30, 40, 45, 50, 60, 75, 90, 120];
const durDefecto = () => Math.min(720, Math.max(5, Number(db.ajustes.citaDuracion) || 45));
const nombrePac = p => p ? (p.apellidos ? `${p.apellidos}, ${p.nombre}` : p.nombre) : 'Paciente eliminado';
const textoDiasSerie = d => d.length === 7 ? 'todos los días' : textoDias(d);
const textoSerie = s => `Cada semana, ${textoDiasSerie(s.dias)}, a las ${s.hora} (${s.duracion} min)`;
const periodoSerie = s => `desde el ${fmt(s.desde)}` + (s.hasta ? ` hasta el ${fmt(s.hasta)}` : ', sin fecha de fin');
const fechaCita = f => { const t = fromIso(f).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: fromIso(f).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
// Colores de las citas: los 11 colores de evento de Google Calendar (así se ven igual allí). '' = el de la aplicación.
const COLORES_CITA = [['', 'Normal', ''], ['7', 'Pavo real', '#039BE5'], ['9', 'Arándano', '#3F51B5'], ['1', 'Lavanda', '#7986CB'], ['3', 'Uva', '#8E24AA'],
  ['4', 'Flamenco', '#E67C73'], ['11', 'Tomate', '#D50000'], ['6', 'Mandarina', '#F4511E'], ['5', 'Plátano', '#F6BF26'], ['2', 'Salvia', '#33B679'], ['10', 'Albahaca', '#0B8043'], ['8', 'Grafito', '#616161']];
const hexColorCita = c => (COLORES_CITA.find(x => x[0] === (c || '')) || COLORES_CITA[0])[2];
const nombreColorCita = c => (COLORES_CITA.find(x => x[0] === (c || '')) || COLORES_CITA[0])[1];
// Estilo de una cita con su color (texto oscuro sobre los colores claros).
function estiloColorCita(c){
  const h = hexColorCita(c); if (!h) return '';
  const n = parseInt(h.slice(1), 16), luz = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return `--cc:${h};--ct:${luz > 0.62 ? '#1d1d1d' : '#fff'};`;
}
function selectorColorHTML(id, actual, cambio){
  return `<div class="colores-cita" id="${id}" role="radiogroup" aria-label="Color de la sesión">${COLORES_CITA.map(([v, t, h]) =>
    `<button type="button" role="radio" aria-checked="${v === (actual || '')}" data-color="${v}" title="${t}" aria-label="${t}" class="${v === (actual || '') ? 'on' : ''}${v ? '' : ' normal'}"
      style="${h ? '--sw:' + h : ''}" onclick="marcarColor('${id}', '${v}')${cambio ? '; ' + cambio : ''}"></button>`).join('')}</div>`;
}
function marcarColor(id, v){
  document.querySelectorAll(`#${id} button`).forEach(b => { const on = b.dataset.color === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
const leerColor = id => { const b = document.querySelector(`#${id} button.on`); return b ? b.dataset.color : ''; };
const SEMANAS_SERIE = 26;   // las series sin fecha de fin tienen creadas sus citas de los próximos 6 meses

// Crea las citas que le faltan a una serie (no toca las que ya existen). Devuelve cuántas ha creado.
function generarSerie(d, s){
  const limite = s.hasta || addDays(todayIso(), 7 * SEMANAS_SERIE);
  const hechas = new Set(d.citas.filter(c => c.serieId === s.id).map(c => c.fechaSerie));
  const excl = new Set(s.excluidas || []);
  let n = 0;
  for (let f = s.desde; f <= limite; f = addDays(f, 1)){
    if (!s.dias.includes(String(((fromIso(f).getDay() + 6) % 7) + 1)) || hechas.has(f) || excl.has(f)) continue;
    d.citas.push({ id: uid(), patientId: s.patientId, fecha: f, hora: s.hora, duracion: s.duracion, nota: s.nota || '', serieId: s.id, fechaSerie: f, color: s.color || '' });
    n++;
  }
  return n;
}
// Al abrir la aplicación, las series sin fecha de fin crean las citas de las semanas que van entrando.
let seriesAmpliadas = false;
function ampliarSeries(d){
  for (const s of d.seriesCitas) if (!s.hasta && generarSerie(d, s)) seriesAmpliadas = true;
}

/* huecos ocupados en Google y solapes */
// Huecos ocupados de un día (en minutos) según los otros calendarios de Google.
function ocupadosDia(fecha){
  const out = [];
  for (const o of gSync.ocupados || []){
    const [fi, hi] = o.inicio.split('T'), [ff, hf] = o.fin.split('T');
    if (fi > fecha || ff < fecha) continue;
    const a = fi < fecha ? 0 : minDe(hi), b = ff > fecha ? 1440 : minDe(hf);
    if (b > a) out.push({ a, b });
  }
  return out;
}
function solapes(fecha, hora, dur, excepto = new Set()){
  const a = minDe(hora), b = a + dur;
  return {
    citas: db.citas.filter(c => c.fecha === fecha && !excepto.has(c.id) && minDe(c.hora) < b && minDe(c.hora) + c.duracion > a).sort(ordenCita),
    ocupados: ocupadosDia(fecha).filter(o => o.a < b && o.b > a)
  };
}
function textoSolapes(x){
  return [...x.citas.map(c => `${c.hora}–${finCita(c)} ${nombrePac(getP(c.patientId))}`),
    ...x.ocupados.map(o => `${horaDe(o.a)}–${horaDe(Math.min(o.b, 1440))} ocupado en Google Calendar`)];
}

/* pantalla Agenda */
const PX_MIN = 1.1;   // altura de un minuto en la cuadrícula
function diasAgenda(){
  if (ui.agVista === 'dia') return [iso(ui.agFecha)];
  const lunes = iso(inicioSemana(ui.agFecha)), visibles = db.ajustes.agendaDias || '12345';
  return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(lunes, i)).filter(f => visibles.includes(digitoDia(f)) || db.citas.some(c => c.fecha === f));
}
// Horas que se ven: las del horario de Ajustes, ampliadas si alguna cita cae fuera.
function rangoHorasAgenda(dias){
  let ini = minDe(db.ajustes.agendaInicio || '08:00'), fin = minDe(db.ajustes.agendaFin || '21:00');
  for (const c of db.citas) if (dias.includes(c.fecha)){
    ini = Math.min(ini, Math.floor(minDe(c.hora) / 60) * 60);
    fin = Math.max(fin, Math.ceil(Math.min(minDe(c.hora) + c.duracion, 1440) / 60) * 60);
  }
  if (fin <= ini) fin = ini + 60;
  return [ini, fin];
}
function tituloAgenda(){

  return `Semana del ${fromIso(lunes).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })} al ${fromIso(dom).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}`;
}
function viewAgenda(){

  if (!ui.agVista) ui.agVista = innerWidth < 700 ? 'dia' : 'semana';   // en pantallas estrechas, un día

          <input type="search" id="buscarAgenda" aria-label="Buscar paciente en la agenda" placeholder="Buscar paciente" style="width:auto;min-width:200px" value="${esc(ui.qAg || '')}" oninput="ui.qAg=this.value; refrescarAgenda()">

function citasAgenda(){

// Vista de mes: una casilla por día con sus citas (las primeras; «+N más» lleva al día).
const MAX_CITAS_MES = 4;
function agendaMesHTML(){
  const f = ui.agFecha, primero = new Date(f.getFullYear(), f.getMonth(), 1), ultimo = iso(new Date(f.getFullYear(), f.getMonth() + 1, 0));
  const hoy = todayIso(), mes = iso(primero).slice(0, 7), visibles = db.ajustes.agendaDias || '12345';
  const citas = citasAgenda(), delMes = citas.filter(c => c.fecha.startsWith(mes));
  const cols = ['1', '2', '3', '4', '5', '6', '7'].filter(d => visibles.includes(d) || delMes.some(c => digitoDia(c.fecha) === d));
  const semanas = [];
  for (let l = iso(inicioSemana(primero)); l <= ultimo; l = addDays(l, 7)) semanas.push(l);
  const celda = fe => {
    const cs = citas.filter(c => c.fecha === fe).sort(ordenCita), oc = ocupadosDia(fe);
    const chips = cs.slice(0, MAX_CITAS_MES).map(c => { const p = getP(c.patientId);
      return `<button class="mes-cita${c.color ? ' con-color' : ''}" style="${estiloColorCita(c.color)}" onclick="event.stopPropagation(); openCita('${c.id}')" title="${esc(`${c.hora}–${finCita(c)} ${nombrePac(p)}${c.nota ? '. ' + c.nota : ''}`)}"><strong>${c.hora}</strong> ${esc(nombrePac(p))}</button>`; }).join('');
    const mas = cs.length > MAX_CITAS_MES ? `<button class="enlace mes-mas" onclick="event.stopPropagation(); verDiaAgenda('${fe}')">+${cs.length - MAX_CITAS_MES} más</button>` : '';
    const ocup = oc.length ? `<div class="mes-ocupado" title="Ocupado en Google Calendar">Ocupado ${oc.slice(0, 2).map(o => `${horaDe(o.a)}–${horaDe(Math.min(o.b, 1440))}`).join(', ')}${oc.length > 2 ? '…' : ''}</div>` : '';
    const d = fromIso(fe);
    return `<div class="mes-celda${fe.slice(0, 7) !== mes ? ' fuera' : ''}${fe === hoy ? ' hoy' : ''}${fe < hoy ? ' pasado' : ''}" data-fecha="${fe}" onclick="openCita(null, { fecha: '${fe}' })">

  };

// La cuadrícula tiene su propio desplazamiento (así los días quedan siempre a la vista). La primera vez empieza
// un poco antes de la hora actual o de la primera cita; después se mantiene donde la deje el usuario.
function situarAgenda(){
  const el = $('#agendaCuerpo .ag-scroll'); if (!el) return;
  if (ui.agScroll == null){
    const dias = diasAgenda(), [ini] = rangoHorasAgenda(dias), d = new Date();
    const primera = Math.min(...db.citas.filter(c => dias.includes(c.fecha)).map(c => minDe(c.hora)), dias.includes(todayIso()) ? d.getHours() * 60 + d.getMinutes() : 1440);
    ui.agScroll = primera < 1440 ? Math.max(0, (primera - 60 - ini) * PX_MIN) : 0;
  }
  el.scrollTop = ui.agScroll;
}
function navAgenda(dir){
  const f = ui.agFecha;
  ui.agFecha = ui.agVista === 'mes' ? new Date(f.getFullYear(), f.getMonth() + dir, 1) : new Date(f.getFullYear(), f.getMonth(), f.getDate() + dir * (ui.agVista === 'dia' ? 1 : 7));
  render();
}
function verDiaAgenda(f){ ui.agFecha = fromIso(f); ui.agVista = 'dia'; render(); }
// Coloca uno al lado de otro los elementos que coinciden en el tiempo. Devuelve Map(elemento → [columna, columnas]).
function columnasSolape(items){
  const res = new Map();
  let grupo = [], finGrupo = -1;
  const cerrar = () => {
    const cols = [];
    for (const it of grupo){
      let k = cols.findIndex(f => f <= it.a);
      if (k < 0){ k = cols.length; cols.push(0); }
      cols[k] = it.b; res.set(it, k);
    }
    grupo.forEach(it => res.set(it, [res.get(it), cols.length]));
    grupo = []; finGrupo = -1;
  };
  for (const it of [...items].sort((x, y) => x.a - y.a || y.b - x.b)){
    if (grupo.length && it.a >= finGrupo) cerrar();
    grupo.push(it); finGrupo = Math.max(finGrupo, it.b);
  }
  if (grupo.length) cerrar();
  return res;
}

function horaPropuesta(fecha){
